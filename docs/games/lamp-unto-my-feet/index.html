<h1 style="position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0">Lamp Unto My Feet</h1>

<script>
'use strict';
(function(){
// ============================================================
// Lamp Unto My Feet — a pilgrimage in six parables
// "Your word is a lamp to my feet and a light to my path." Psalm 119:105 (ESV)
// Everything here is drawn and sounded in code. No outside files.
// ============================================================
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const homeLink=document.getElementById('home');
const VH=360,T=24,TAU=Math.PI*2;
let VW=640,SC=1,OX=0,OY=0,CW=0,CH=0,DPR=1,portrait=false,safe={t:0,r:0,b:0,l:0};
let darkCv=document.createElement('canvas'),dctx=darkCv.getContext('2d');
let bgCache=null;
const rnd=(a,b)=>b===undefined?Math.random()*(a===undefined?1:a):a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
function seeded(s){return function(){s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
const FONT='Georgia,"Iowan Old Style","Palatino Linotype",Palatino,"Times New Roman",serif';
function font(px,style){ctx.font=(style?style+' ':'')+px+'px '+FONT;}
function wrap(text,maxW){const words=String(text).split(' ');const lines=[];let cur='';for(const w of words){const t=cur?cur+' '+w:w;if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=w;}else cur=t;}if(cur)lines.push(cur);return lines;}
function textBlock(text,x,y,maxW,lh,align){ctx.textAlign=align||'center';const ls=wrap(text,maxW);for(let i=0;i<ls.length;i++)ctx.fillText(ls[i],x,y+i*lh);return ls.length*lh;}
function rrect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath();}
function glow(c,x,y,r,col,a){const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col);g.addColorStop(1,'rgba(0,0,0,0)');c.globalAlpha=a===undefined?1:a;c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,TAU);c.fill();c.globalAlpha=1;}

function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  CW=window.innerWidth;CH=window.innerHeight;
  cv.width=Math.max(1,Math.round(CW*DPR));cv.height=Math.max(1,Math.round(CH*DPR));
  try{const cs=getComputedStyle(document.getElementById('safe'));safe={t:parseFloat(cs.paddingTop)||0,r:parseFloat(cs.paddingRight)||0,b:parseFloat(cs.paddingBottom)||0,l:parseFloat(cs.paddingLeft)||0};}catch(e){}
  portrait=CH>CW*1.05;
  VW=Math.max(480,Math.min(900,Math.round(VH*CW/CH)));
  SC=Math.min(CW/VW,CH/VH);
  OX=(CW-VW*SC)/2;
  OY=portrait?Math.max(safe.t+48,(CH-VH*SC)*0.2):(CH-VH*SC)/2;
  darkCv.width=Math.ceil(VW/2);darkCv.height=VH/2;
  bgCache=null;
}
addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,200));

// ---------------- Save ----------------
const SAVE_KEY='lampUntoMyFeet.save.v1';
function freshSave(){return {unlocked:0,virtues:[false,false,false,false],scrolls:{},lost:{},best:{},glad:{},journal:{},rooms:{},words:{},mute:false,finished:false,started:false,retUnlocked:0,retDone:false};}
let save=freshSave();
function normSave(){if(!Array.isArray(save.virtues)||save.virtues.length!==4)save.virtues=[false,false,false,false];for(const k of ['scrolls','lost','best','glad','journal','rooms','words'])if(!save[k]||typeof save[k]!=='object')save[k]={};}
function loadSave(){try{const s=localStorage.getItem(SAVE_KEY);if(s){const o=JSON.parse(s);if(o&&typeof o==='object'){Object.assign(save,o);normSave();}}}catch(e){}}
function replaceSave(o){for(const k in save)delete save[k];Object.assign(save,freshSave(),o||{});normSave();}
function writeLocal(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}}
function writeSave(){writeLocal();cloudChanged();}

// ---------------- Account ----------------
// Sign in with a username (4 to 12 characters) and a 4-digit passcode, and the journey is kept on the
// shared /api server too, so it can be picked up on any device. This device always keeps its own copy and
// plays fine offline. Progress only ever grows, so the server merges what each device sends (see mergeLamp
// in netlify/functions/api.mjs) and two devices can never erase each other's steps.
const ACCT_KEY='lampUntoMyFeet.account.v1',GUEST_KEY='lampUntoMyFeet.guest.v1';
const PROGRESS_FIELDS=['unlocked','retUnlocked','started','finished','retDone','shone','virtues','scrolls','lost','glad','journal','rooms','words','best'];
const acct={token:null,name:'',key:'',pending:false};
const sync={busy:null,timer:0,fails:0,ver:0,status:'',lastPull:0};
function loadAcct(){try{const o=JSON.parse(localStorage.getItem(ACCT_KEY)||'null');if(o&&typeof o==='object')for(const k in acct)if(k in o)acct[k]=o[k];}catch(e){}}
function writeAcct(){try{localStorage.setItem(ACCT_KEY,JSON.stringify(acct));}catch(e){}}
function api(action,extra,keep){
  if(typeof fetch!=='function')return Promise.resolve(null);
  return Promise.resolve(null)||fetch('/api',{method:'POST',headers:{'content-type':'application/json'},keepalive:!!keep,
    body:JSON.stringify(Object.assign({action:action,game:'lamp',token:acct.token||null},extra||{}))})
    .then(r=>r.json()).catch(()=>null);
}
// Combine two journeys: everything found on either one stays found. Keep in step with mergeLamp on the server.
function mergeProgress(a,b){
  const plain=x=>(x&&typeof x==='object'&&!Array.isArray(x))?x:{},okKey=k=>typeof k==='string'&&k.length<=24&&/^[A-Za-z0-9_-]+$/.test(k);
  const stage=x=>Math.max(0,Math.min(17,Math.floor(Number(x)||0)));
  a=plain(a);b=plain(b);
  const out={unlocked:Math.max(stage(a.unlocked),stage(b.unlocked)),retUnlocked:Math.max(stage(a.retUnlocked),stage(b.retUnlocked))};
  for(const f of ['started','finished','retDone','shone'])out[f]=!!(a[f]||b[f]);
  const va=Array.isArray(a.virtues)?a.virtues:[],vb=Array.isArray(b.virtues)?b.virtues:[];
  out.virtues=[0,1,2,3].map(i=>!!(va[i]||vb[i]));
  for(const f of ['scrolls','lost','glad','journal','rooms','words']){const m={};let n=0;
    for(const src of [plain(a[f]),plain(b[f])])for(const k in src)if(src[k]&&okKey(k)&&!m[k]&&n<400){m[k]=1;n++;}
    out[f]=m;}
  const best={};let n=0;
  for(const src of [plain(a.best),plain(b.best)])for(const k in src){const t=Math.round(Number(src[k])*10)/10;
    if(!okKey(k)||!(t>0)||!isFinite(t))continue;
    if(best[k]===undefined){if(n<300){best[k]=t;n++;}}else if(t<best[k])best[k]=t;}
  out.best=best;
  return out;
}
function progressOf(s){const o={};for(const k of PROGRESS_FIELDS)o[k]=s[k];return o;}
function hasProgress(s){return !!(s&&(s.started||s.unlocked>0||Object.keys(s.scrolls||{}).length));}
function absorb(p){if(!p)return;Object.assign(save,mergeProgress(save,p));writeLocal();}
function cloudChanged(){
  sync.ver++;if(!acct.token)return;
  if(!acct.pending){acct.pending=true;writeAcct();}
  if(!sync.timer&&!sync.busy)sync.timer=setTimeout(pushSync,2500);
}
// Send this device's journey; the reply is the merged journey from every device, folded back in here.
function pushSync(keep){
  clearTimeout(sync.timer);sync.timer=0;
  if(!acct.token)return Promise.resolve(false);
  if(sync.busy)return sync.busy;
  const ver=sync.ver,tok=acct.token;sync.lastPull=Date.now();
  sync.busy=api('progress',{data:progressOf(save)},keep).then(j=>{
    sync.busy=null;
    if(acct.token!==tok){if(acct.token&&acct.pending&&!sync.timer)sync.timer=setTimeout(pushSync,300);return false;}
    if(j&&j.ok){sync.fails=0;sync.status='';absorb(j.progress);
      if(sync.ver===ver){acct.pending=false;writeAcct();}else if(!sync.timer)sync.timer=setTimeout(pushSync,1000);
      return true;}
    if(j&&j.error==='not logged in'){acct.token=null;writeAcct();sync.status='expired';return false;}
    sync.fails++;sync.status='offline';
    if(!sync.timer)sync.timer=setTimeout(pushSync,Math.min(60000,4000*Math.pow(2,sync.fails-1)));
    return false;
  });
  return sync.busy;
}
function acctStatus(){
  if(!acct.token)return sync.status==='expired'||save.acct?'Sign in again to keep saving':'Keep your journey on any device';
  if(sync.status==='offline')return acct.pending?'Offline. Will save when it can.':'Offline';
  if(sync.busy||acct.pending)return 'Saving…';
  return 'Journey saved';
}
function journeyWords(s){
  const n=Object.keys(s.scrolls||{}).length,sc=n+' of 54 scroll'+(n===1?'':'s');
  if(s.finished)return 'the whole road walked, '+sc;
  return 'Chapter '+NUMW[Math.min(5,(Math.min(17,s.unlocked||0)/3)|0)]+', '+sc;
}
function signIn(mode,name,pin){
  return api('auth',{mode:mode,name:name,pin:pin,token:null}).then(j=>{
    if(!j)return {err:'Can’t reach the server right now. Check your connection and try again.'};
    if(!j.ok||!j.token||!j.me)return {err:String(j.error||'Could not sign in').replace(/\bPIN\b/g,'passcode')};
    return {login:{token:j.token,name:j.me.name,key:j.me.key,cloud:j.progress||null,created:!!j.created}};
  });
}
// choice: 'merge' adds this device's guest journey to the account; 'apart' sets it aside until sign-out.
function finishSignIn(L,choice){
  const mine=save.acct===L.key||choice==='merge',mute=save.mute;
  if(choice==='apart'){try{localStorage.setItem(GUEST_KEY,JSON.stringify(save));}catch(e){}}
  replaceSave(Object.assign(mergeProgress(mine?save:null,L.cloud),{mute:mute,acct:L.key}));
  acct.token=L.token;acct.name=L.name;acct.key=L.key;acct.pending=true;writeAcct();writeLocal();
  sync.status='';sync.fails=0;sync.ver++;pushSync();
}
function finishSignOut(){
  const tok=acct.token,mute=save.mute;
  if(tok)api('logout',{token:tok});
  clearTimeout(sync.timer);sync.timer=0;sync.status='';
  acct.token=null;acct.key='';acct.pending=false;writeAcct();
  let g=null;try{g=JSON.parse(localStorage.getItem(GUEST_KEY)||'null');localStorage.removeItem(GUEST_KEY);}catch(e){}
  replaceSave(Object.assign(g&&typeof g==='object'?g:{},{mute:mute}));delete save.acct;writeLocal();
}
function startCloud(){
  loadAcct();
  if(acct.token&&save.acct!==acct.key){save.acct=acct.key;writeLocal();}
  if(acct.token)pushSync();
  document.addEventListener('visibilitychange',()=>{if(!acct.token)return;
    if(document.hidden){if(acct.pending)pushSync(true);}
    else if(Date.now()-sync.lastPull>5000)pushSync();});
  addEventListener('pagehide',()=>{if(acct.token&&acct.pending)pushSync(true);});
  addEventListener('online',()=>{if(acct.token)pushSync();});
}

// The sign-in window is a plain HTML form over the canvas, so phones bring up a real keyboard.
const acctUI={open:false,el:null,view:'',mode:'login',login:null,busy:false};
const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
function openAccount(){
  if(!acctUI.el){const el=document.createElement('div');el.id='acct';document.body.appendChild(el);acctUI.el=el;
    el.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)acctAction(b.getAttribute('data-a'));else if(e.target===el&&acctUI.view==='me'&&!acctUI.busy)acctAction('close');});
    el.addEventListener('submit',e=>{e.preventDefault();acctSubmit();});
    el.addEventListener('keydown',e=>{if(e.key==='Escape'&&!acctUI.busy){e.preventDefault();acctAction('close');}});
    el.addEventListener('input',e=>{if(e.target.id==='acctP')e.target.value=e.target.value.replace(/\D/g,'').slice(0,4);if(!acctUI.busy)acctNote('');});}
  for(const k in keys)keys[k]=false;for(const k in touches)delete touches[k];mouseShine=false;
  acctUI.open=true;acctUI.el.className='on';acctUI.busy=false;
  if(acct.token)acctView('me');else{acctUI.mode='login';acctView('form');}
}
function closeAccount(){acctUI.open=false;acctUI.busy=false;acctUI.login=null;if(acctUI.el){acctUI.el.className='';acctUI.el.innerHTML='';}try{document.activeElement.blur();}catch(e){}}
function acctView(v,note){
  acctUI.view=v;const el=acctUI.el,c=acctUI.mode==='create';let h='';
  if(v==='form'){
    const again=!!(acct.name&&save.acct&&!c);
    h='<form class="box" role="dialog" aria-modal="true" aria-labelledby="acctH" novalidate><h2 id="acctH">Your Account</h2>'+
      '<p>'+(again?'Sign in again to keep saving your journey.':'Sign in to keep your journey safe and pick it up again on any device.')+'</p>'+
      '<div class="tabs"><button type="button" data-a="login"'+(c?'':' class="on" aria-pressed="true"')+'>Sign In</button><button type="button" data-a="create"'+(c?' class="on" aria-pressed="true"':'')+'>New Account</button></div>'+
      '<label for="acctN">Username</label><input id="acctN" name="username" maxlength="12" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" value="'+esc(c?'':acct.name||'')+'">'+
      '<div class="hint">4 to 12 letters or numbers</div>'+
      '<label for="acctP">Passcode</label><input id="acctP" name="passcode" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="'+(c?'new-password':'current-password')+'">'+
      '<div class="hint">'+(c?'Choose 4 numbers. Write your username and passcode down: you will need both on your other devices.':'4 numbers')+'</div>'+
      '<div class="err" role="alert">'+esc(note||'')+'</div>'+
      '<div class="row"><button type="button" data-a="close">Cancel</button><button type="submit" class="main">'+(c?'Create Account':'Sign In')+'</button></div></form>';
  }else if(v==='choice'){
    const L=acctUI.login;
    h='<div class="box" role="dialog" aria-modal="true" aria-labelledby="acctH"><h2 id="acctH">Bring This Journey?</h2>'+
      '<p>This device has a journey that is not saved to any account: <b>'+esc(journeyWords(save))+'</b>.</p>'+
      '<p>'+(hasProgress(L.cloud)?'<b>'+esc(L.name)+'</b> already has <b>'+esc(journeyWords(L.cloud))+'</b>. Add this one too, and everything found on either is kept.':'Add it to <b>'+esc(L.name)+'</b> to keep it safe and take it to your other devices.')+'</p>'+
      '<div class="row"><button type="button" data-a="apart">Keep It Apart</button><button type="button" class="main" data-a="merge">Add It</button></div>'+
      '<div class="hint mid">If you keep it apart, it waits on this device and comes back when you sign out.</div></div>';
  }else if(v==='me'){
    const s=acctStatus(),ok=s==='Journey saved';
    h='<div class="box" role="dialog" aria-modal="true" aria-labelledby="acctH"><h2 id="acctH">Your Account</h2>'+
      '<p>Signed in as <b>'+esc(acct.name)+'</b></p>'+
      '<p class="st">'+(ok?'Your journey is saved to your account: '+esc(journeyWords(save))+'.':esc(s))+'</p>'+
      '<div class="hint mid">To keep going on another phone or computer, open Lamp Unto My Feet there and sign in with the same username and passcode.</div>'+
      '<div class="err slim" role="alert">'+esc(note||'')+'</div>'+
      '<div class="row"><button type="button" data-a="out">Sign Out</button><button type="button" class="main" data-a="close">Done</button></div></div>';
  }else if(v==='outfail'){
    h='<div class="box" role="dialog" aria-modal="true" aria-labelledby="acctH"><h2 id="acctH">Not Saved Yet</h2>'+
      '<p>The server can’t be reached, so your newest steps are only on this device. If you sign out now, they will be lost.</p>'+
      '<div class="row"><button type="button" data-a="outnow">Sign Out Anyway</button><button type="button" class="main" data-a="me">Stay Signed In</button></div></div>';
  }
  el.innerHTML=h;

// ============================================================
// LEVEL BUILDER. Levels are hand-laid, left to right, from short commands.
// Heights are counted in tiles up from the bottom of the level.
// ============================================================
function Builder(rows){this.rows=rows;this.t={};this.x=0;this.sx=0;this.h=4;this.ents=[];this.dkk=[];this.mat='#';this.sci=0;this.fg={};this.maxc=0;this.startH=null;this.gusts=[];}
const BP=Builder.prototype;
BP.set=function(c,hh,ch){if(c<0||hh<1||hh>this.rows)return;this.t[(this.rows-hh)*8192+c]=ch;if(c>this.maxc)this.maxc=c;};
BP.g=function(w,h,mat){for(let c=this.x;c<this.x+w;c++)for(let k=1;k<=h;k++)this.set(c,k,mat||this.mat);this.sx=this.x;this.x+=w;this.h=h;if(this.startH===null)this.startH=h;return this;};
BP.pit=function(w){this.sx=this.x;this.x+=w;return this;};
BP.fb=function(w){for(let c=this.x;c<this.x+w;c++)this.set(c,this.h,'F');this.sx=this.x;this.x+=w;return this;};
BP.cr=function(w){for(let c=this.x;c<this.x+w;c++)this.set(c,this.h,'C');this.sx=this.x;this.x+=w;return this;};
BP.p=function(dx,h,w,ch){for(let i=0;i<w;i++)this.set(this.sx+dx+i,h,ch||'-');return this;};
BP.fp=function(dx,h,w){return this.p(dx,h,w,'F');};
BP.fill=function(c0,c1,h0,h1,ch){for(let c=c0;c<=c1;c++)for(let k=h0;k<=h1;k++)this.set(c,k,ch||'#');if(c1+1>this.x)this.x=c1+1;return this;};
BP.at=function(col,h){this.sx=col;this.h=h;return this;};
BP.climb=function(h0,step,list,ch){for(let i=0;i<list.length;i++){const L=list[i];for(let k=0;k<L[1];k++)this.set(L[0]+k,h0+i*step,L[2]||ch||'-');}return this;};
BP.sw=function(dx,hh,w){hh=hh||5;w=w||1;for(let i=0;i<w;i++)for(let k=0;k<hh;k++)this.set(this.sx+dx+i,this.h+1+k,'S');return this;};
BP.arch=function(dx){for(let k=4;k<=11;k++)this.set(this.sx+dx,this.h+k,'=');return this;};
BP.e=function(type,dx,h,props){const o=Object.assign({type:type,x:(this.sx+dx+0.5)*T,y:(this.rows-(h===undefined||h===null?this.h:h))*T},props||{});this.ents.push(o);return this;};
BP.cp=function(dx,h,hint){return this.e('cp',dx,h,hint?{hint:hint}:{});};
BP.hint=function(dx,id,h){return this.e('hint',dx,h,{id:id});};
BP.sc=function(dx,h,i){return this.e('scroll',dx,h,{i:i===undefined?this.sci++:i});};
BP.oil=function(dx,h){return this.e('oil',dx,h);};
BP.glad=function(dx,h){return this.e('glad',dx,h);};
BP.sh=function(dx,range){return this.e('sh',dx,this.h,{k:'w',x0:(this.sx+dx+0.5)*T,x1:(this.sx+dx+(range||4)+0.5)*T});};
BP.fl=function(dx,h,amp){return this.e('sh',dx,h,{k:'f',amp:(amp||1)*T});};
BP.dr=function(dx,h,range){return this.e('sh',dx,h,{k:'d',x0:(this.sx+dx+0.5)*T,x1:(this.sx+dx+(range||4)+0.5)*T});};
BP.ch=function(dx,h){return this.e('sh',dx,h,{k:'c'});};
BP.swm=function(dx,h){return this.e('sh',dx,h,{k:'s'});};
BP.sign=function(dx,text){return this.e('sign',dx,null,{text:text});};
BP.shrine=function(dx,v){return this.e('shrine',dx,null,{v:v});};
BP.lost=function(dx,h){return this.e('lost',dx,h);};
BP.wand=function(dx,name,thanks){this.arch(dx);return this.e('wand',dx,null,{name:name,thanks:thanks});};
BP.gate=function(dx,name){this.arch(dx);return this.e('gate',dx,null,{name:name});};
BP.burden=function(dx,name){return this.e('burden',dx,null,{name:name});};
BP.cross=function(dx){return this.e('cross',dx);};
BP.soil=function(dx,H){return this.e('soil',dx,null,{H:H,c:this.sx+dx,gh:this.h});};
BP.carry=function(dx,who){return this.e('carry',dx,null,{who:who});};
BP.goal=function(dx,kind,h){return this.e('goal',dx,h,{kind:kind});};
BP.deco=function(dx,kind,h){return this.e('deco',dx,h,{kind:kind});};
BP.door=function(dx){return this.e('door',dx);};
BP.exit=function(dx){return this.e('exit',dx);};
BP.fount=function(dx){return this.e('fount',dx);};
BP.boat=function(dx,h,w,ax,per){const o={type:'boat',w:w*T,ax:(ax||0)*T,per:per||5,ph:(this.sx*0.7)%6};o.bx=(this.sx+dx+w/2)*T;o.by=(this.rows-h)*T;o.x=o.bx;o.y=o.by;o.dx=0;o.dy=0;this.ents.push(o);return this;};
BP.dk=function(v){this.dkk.push([this.x,v]);return this;};
BP.flag=function(k,v){this.fg[k]=v;return this;};
BP.mk=function(k){this.fg[k]=this.x*T;return this;};
BP.gust=function(dx,w){this.gusts.push({x1:(this.sx+dx)*T,x2:(this.sx+dx+w)*T});return this;};
BP.vigil=function(dx1,dx2){this.fg.vigil={x1:(this.sx+dx1)*T,x2:(this.sx+dx2)*T,t:0,done:false,off:0};for(let k=1;k<=8;k++)this.set(this.sx+dx2,this.h+k,'V');return this;};
// Tasks that take two. A Lost One walking with you can hold a ladder, lower a bridge, push a stone or row a boat.
// Without a friend these block the road, so a forgotten Lost One means going back for them.
BP.ladder=function(dx,hh){return this.e('help',dx,null,{kind:'ladder',c:this.sx+dx,gh:this.h,hh:hh});};
BP.bridge=function(dx,w,art){return this.e('help',dx,null,{kind:'bridge',c0:this.sx+dx+1,w:w,gh:this.h,art:art||'plank'});};
BP.stone=function(dx){const c=this.sx+dx;for(let k=1;k<=3;k++){this.set(c,this.h+k,'O');this.set(c+1,this.h+k,'O');}
  const o=this.e('help',dx,null,{kind:'stone',c:c,gh:this.h});this.ents[this.ents.length-1].x=(c+1)*T;return o;};
// A low rock ceiling over part of the current ground, starting clear tiles above it and reaching the top of the level.
BP.roof=function(dx0,dx1,clear){for(let c=this.sx+dx0;c<=this.sx+dx1;c++)for(let k=this.h+clear+1;k<=this.rows;k++)this.set(c,k,'#');return this;};
// A rowboat at the end of a pier: it carries you dist tiles across open water, but only with someone at the oars.
BP.ferry=function(dx,w,dist,h){const o={type:'boat',ferry:true,w:w*T,ax:0,per:5,ph:0,rest:true};o.fx0=(this.sx+dx+w/2)*T;o.fx1=o.fx0+dist*T;o.bx=o.fx0;o.by=(this.rows-(h||3.6))*T;o.x=o.bx;o.y=o.by;o.dx=0;o.dy=0;this.ents.push(o);
  return this.e('help',dx-1,null,{kind:'ferry',boat:o,dist:dist});};
BP.finish=function(){
  const W=Math.max(this.maxc+1,this.x),H=this.rows,tiles=[];
  for(let r=0;r<H;r++){const row=new Array(W);for(let c=0;c<W;c++)row[c]=this.t[r*8192+c]||' ';tiles.push(row);}
  const lv=Object.assign({W:W,H:H,tiles:tiles,ents:this.ents,dk:this.dkk.length?this.dkk:[[0,0.2]],gusts:this.gusts,sH:new Float32Array(W*H).fill(1),rev:new Float32Array(W*H),cr:new Float32Array(W*H)},this.fg);
  const st=this.fg.start||{col:2,h:this.startH||4};
  lv.startX=(st.col+0.5)*T;lv.startY=(H-st.h)*T;
  return lv;
};

let state='title',G=null,runMode='pilgrim';
function gladCount(){return Object.keys(save.glad).length;}
function hiddenCount(){let n=0;for(const k in save.scrolls){const q=k.split('-');if(q[2]==='2'&&+q[1]<2)n++;}return n;}
function lampRadius(){return 135+gladCount()*5+hiddenCount()*6;}
function oilMax(){return 100+gladCount()*3+hiddenCount()*10;}
function buildLevel(fn,rows){const b=new Builder(rows||20);fn(b);return b.finish();}
function prepLevel(lv,ci,si,ng,isRoom){
  const names=CHAP[ci].shadows;let n=0;const extra=[];
  for(const e of lv.ents){
    if(e.type==='sh'){e.name=names[n++%names.length];e.a=1;e.y-=16;e.bx=e.x;e.by=e.y;e.t=rnd(6);e.dir=1;e.sp=ng?1.4:1;e.gone=false;e.r=e.k==='s'?15:11;
      if(ng&&e.k==='w')extra.push({type:'sh',k:'d',x:e.x,y:e.y-66,bx:e.x,by:e.y-66,x0:e.x0,x1:e.x1,name:names[n++%names.length],a:1,t:rnd(6),dir:-1,sp:1.3,gone:false,r:11});}
    else if(e.type==='scroll'){if(save.scrolls[ci+'-'+si+'-'+e.i])e.got=true;}
    else if(e.type==='glad'){if(save.glad[ci+'-'+si])e.gone=true;}
  }
  for(const x of extra)lv.ents.push(x);
  if(isRoom)lv.ents.push({type:'exit',x:1.5*T,y:lv.startY});
}
function newPlayer(lv){return {x:lv.startX,y:lv.startY,vx:0,vy:0,h:28,face:1,ground:false,coy:0,buf:0,anim:0,shine:false,oil:70,carry:null,burdens:[],riding:null,glide:false,sq:0,sinkOff:0};}
function startStage(ci,si){
  ci=clamp(ci|0,0,5);si=clamp(si|0,0,2);
  const st=CHAP[ci].stages[si],ng=runMode==='return';
  const lv=buildLevel(st.build,st.rows);prepLevel(lv,ci,si,ng,false);
  for(let v=0;v<4;v++)if(ng||v+1<ci||(v+1===ci&&si>0))save.virtues[v]=true;
  G={ci:ci,si:si,lv:lv,main:lv,room:false,ret:null,ch:CHAP[ci],st:st,ng:ng,t:0,time:0,stumbles:0,lostFound:false,
    p:newPlayer(lv),cam:{x:0,y:0,shake:0},cp:{x:lv.startX,y:lv.startY},parts:[],toast:null,verse:null,note:null,ending:null,carried:0,
    faith:100,sink:0,intro:3.4,flash:0,calm:0,followers:[],vcard:null,graceI:(Math.random()*GRACE.length)|0,wayI:(ci*3+si)%WAYSIDE.length,
    lr:62,near:null,signText:null,gspawn:0,father:null,trail:[],thunder:rnd(4,9),done:null,dawn:0};
  if(lv.startCarry)G.p.carry=lv.startCarry;
  if(lv.startBurdens)G.p.burdens=lv.startBurdens.slice();
  if(lv.storm)lv.storm.x=-320;
  save.started=true;writeSave();
  if(ci===0&&si===0)journal('start');
  if(ng)journal('return');
  state='play';setMusic(CHAP[ci].song);music.swell=si===2?0.5:0;bgCache=null;updateCam(0,true);
}
function enterRoom(){
  const key=G.ci+'-'+G.si;if(!ROOMS[key])return;
  const lv=buildLevel(ROOMS[key],20);prepLevel(lv,G.ci,G.si,G.ng,true);
  const p=G.p;G.ret={x:p.x,y:p.y,cp:G.cp,burdens:p.burdens.slice(),carry:p.carry};
  G.lv=lv;G.room=true;p.x=lv.startX+T;p.y=lv.startY;p.vx=p.vy=0;p.riding=null;G.cp={x:p.x,y:p.y};
  journal('room');toast(save.scrolls[G.ci+'-'+G.si+'-2']?'A harder way. You found this hidden scroll before.':'A harder way. Reach the hidden scroll at the far end, and your lamp grows stronger for the rest of the journey.');sfx('cp');updateCam(0,true);
}
function leaveRoom(){
  const p=G.p;if(G.hiddenNew&&!G.hiddenTold){G.hiddenTold=true;G.reward=null;toast('Back on the road, with a stronger lamp.');}G.lv=G.main;G.room=false;p.x=G.ret.x;p.y=G.ret.y;p.vx=p.vy=0;G.cp=G.ret.cp;p.burdens=G.ret.burdens;p.carry=G.ret.carry;sfx('cp');updateCam(0,true);
}
function readHint(id){const H=HINTS[id];if(!H)return;showVerse(H.v,'hint',H.gloss);G.hintK=H.v;guide(H.look);}
function guide(look){if(!look||!G)return;const p=G.p,lv=G.lv;let tx=null,ty=null;
  if(look.indexOf('tile:')===0){const ch=look.slice(5),c0=Math.max(0,Math.floor(p.x/T)),c1=Math.min(lv.W-1,c0+45);
    outer:for(let c=c0;c<=c1;c++)for(let r=0;r<lv.H;r++)if(lv.tiles[r][c]===ch&&(ch!=='S'||lv.sH[r*lv.W+c]>0)){tx=c*T+12;ty=r*T+(ch==='S'?12:-8);break outer;}}
  else{let best=1e9;for(const e of lv.ents){if(e.gone||e.type!==look)continue;if((look==='lost'&&e.found)||(look==='help'&&e.done)||(look==='sh'&&e.a<0.3))continue;
      const d=e.x-p.x;if(d>-2*T&&d<45*T&&d<best){best=d;tx=e.x;ty=e.y-(look==='sh'?0:26);}}}
  if(tx!==null)G.guide={x0:p.x+p.face*10,y0:p.y-24,x1:tx,y1:ty,t:0};}
function guidePos(g){const k=clamp(g.t/1.8,0,1),e=k*k*(3-2*k);return {x:lerp(g.x0,g.x1,e),y:lerp(g.y0,g.y1,e)-Math.sin(k*Math.PI)*70,k:k};}
function toast(text,o){o=o||{};G.toast={text:text,t:0};const q=text.charAt(0)==='“';say(text,{pri:o.pri||(q?2:1),pitch:o.pitch||(q?1.14:1)});}
// Verses stay up long enough to read (and for the voice to finish), longer for longer verses.
function showVerse(k,kind,gloss){const n=(V(k)+' '+(gloss||'')).split(' ').length;
  G.verse={k:k,t:0,kind:kind||'scroll',label:refLabel(k),gloss:gloss||null,dur:clamp(n*0.42+3,8,18)};sayVerse(k,gloss);G.verse.gen=voice.gen;}
function part(x,y,vx,vy,life,col,size,grav,glw){if(G.parts.length>240)G.parts.shift();G.parts.push({x:x,y:y,vx:vx,vy:vy,life:life,max:life,col:col,size:size||2,g:grav||0,glow:glw||0});}
function burst(x,y,n,col,sp,glw){for(let i=0;i<n;i++){const a=rnd(TAU),s=rnd(sp*0.3,sp);part(x,y,Math.cos(a)*s,Math.sin(a)*s,rnd(0.4,1.1),col,rnd(1.5,3),0,glw);}}

function tileCh(c,r){const lv=G.lv;if(r<0||r>=lv.H)return ' ';if(c<0||c>=lv.W)return '#';return lv.tiles[r][c];}
function solid(c,r){const ch=tileCh(c,r);
  switch(ch){case '#':case '=':case '~':case 'C':case 'P':case 'O':return true;
    case 'S':return G.lv.sH[r*G.lv.W+c]>0;
    case 'V':return !(G.lv.vigil&&G.lv.vigil.done);
    default:return false;}}
function oneWay(c,r){const ch=tileCh(c,r);if(ch==='-'||ch==='L')return true;if(ch==='F')return save.virtues[0];if(ch==='B')return G.lv.grow&&G.lv.grow.on&&r*T>=G.lv.grow.y;return false;}
function blockers(){const out=[];for(const e of G.lv.ents){if((e.type==='wand'&&!e.friend)||(e.type==='gate'&&!e.open))out.push(e);}return out;}
function moveX(p,dx){
  if(!dx)return;const ox=p.x;p.x+=dx;
  const t=Math.floor((p.y-p.h)/T),b=Math.floor((p.y-0.01)/T);
  if(dx>0){const c=Math.floor((p.x+7)/T);for(let r=t;r<=b;r++)if(solid(c,r)){p.x=c*T-7.01;p.vx=0;break;}}
  else{const c=Math.floor((p.x-7)/T);for(let r=t;r<=b;r++)if(solid(c,r)){p.x=(c+1)*T+7.01;p.vx=0;break;}}
  for(const e of blockers()){if(Math.abs(p.y-e.y)<80&&Math.abs(p.x-e.x)<17){p.x=ox<e.x?e.x-17:e.x+17;p.vx=0;}}
}
function moveY(p,dy,fx){
  const prevB=p.y;p.y+=dy;p.ground=false;let landed=null;
  const l=Math.floor((p.x-6)/T),r=Math.floor((p.x+6)/T);
  if(dy>=0){
    const rr=Math.floor(p.y/T);
    for(let c=l;c<=r;c++){if(solid(c,rr)||(oneWay(c,rr)&&prevB<=rr*T+0.01)){p.y=rr*T;p.ground=true;break;}}
    if(!p.ground){for(const e of G.lv.ents){if(e.type!=='boat')continue;if(Math.abs(p.x-e.x)<e.w/2+5&&prevB<=e.y-e.dy+5&&p.y>=e.y){p.y=e.y;p.ground=true;landed=e;break;}}}
    if(p.ground){if(p.vy>260&&fx!==false){sfx('land');p.sq=1;for(let i=0;i<4;i++)part(p.x+rnd(-6,6),p.y,rnd(-40,40),rnd(-30,-5),0.4,'rgba(230,220,200,0.6)',2);}p.vy=0;}
  }else{
    const rr=Math.floor((p.y-p.h)/T);
    for(let c=l;c<=r;c++)if(solid(c,rr)){p.y=(rr+1)*T+p.h;p.vy=0;break;}
  }
  p.riding=landed;
}
// One step of the pilgrim's movement: run, jump, glide, fall, collide. I = {l,r,jump,jumpP}.
// fx=false skips sounds and sparkles (used by the level checker in the test hooks).
function stepMove(p,dt,I,fx){
  const lv=G.lv,nb=Math.min(5,p.burdens.length),bear=p.carry==='traveler'&&!G.helpCarry;
  const spd=150*(1-0.07*nb)*(bear?0.8:1)*(lv.home&&nb===0?1.2:1);
  const jv=520*(1-0.06*nb)*(bear?0.95:1);
  let ax=0;if(I.l)ax-=1;if(I.r)ax+=1;
  if(ax){p.vx+=ax*(p.ground?1500:1000)*dt;p.face=ax;}
  else{const f=(p.ground?1400:500)*dt;if(Math.abs(p.vx)<=f)p.vx=0;else p.vx-=Math.sign(p.vx)*f;}
  p.vx=clamp(p.vx,-spd,spd);
  let wind=0;for(const g of lv.gusts){if(p.x>g.x1&&p.x<g.x2)wind=-48*(0.6+0.4*Math.sin(G.t*1.7))*(1-G.calm);}
  G.wind=wind;
  if(I.jumpP)p.buf=0.12;else p.buf-=dt;
  if(p.ground)p.coy=0.1;else p.coy-=dt;
  if(p.buf>0&&p.coy>0){p.vy=-jv;p.buf=0;p.coy=0;p.ground=false;p.riding=null;p.jumping=true;if(fx){sfx('jump');p.sq=-1;for(let i=0;i<3;i++)part(p.x+rnd(-5,5),p.y,rnd(-30,30),rnd(-10,0),0.35,'rgba(230,220,200,0.5)',2);}}
  if(p.jumping&&!I.jump&&p.vy<-170)p.vy=-170;
  if(p.vy>=0)p.jumping=false;
  p.vy+=1500*dt;
  p.glide=false;
  if(save.virtues[1]&&I.jump&&!p.ground&&p.vy>55&&p.coy<=0){p.vy=55;p.glide=true;if(fx&&Math.random()<dt*20)part(p.x-p.face*10,p.y-18,-p.face*20,rnd(-5,10),0.6,'#fff7d8',2,0,1);}
  if(p.vy>620)p.vy=620;
  moveX(p,(p.vx+wind)*dt);moveY(p,p.vy*dt,fx);
}
function darkAt(){
  const lv=G.lv,col=G.p.x/T,k=lv.dk;let d=k[0][1];
  for(let i=0;i<k.length;i++){if(col>=k[i][0]){d=k[i][1];if(i+1<k.length){const n=k[i+1];if(n[0]-k[i][0]<=12)d=lerp(k[i][1],n[1],clamp((col-k[i][0])/Math.max(1,n[0]-k[i][0]),0,1));}}}
  if(G.ng)d+=0.06;
  if(lv.skyClimb)d*=clamp(G.p.y/(lv.H*T),0,1);
  d*=1-0.65*G.calm;d*=1-0.4*G.dawn;
  return clamp(d,0,0.95);
}
function stumble(){
  if(G.carried>0||G.ending||G.sink>0)return;const p=G.p;
  G.stumbles++;G.carried=1.5;G.fromX=p.x;G.fromY=p.y-14;sfx('stumble');G.cam.shake=5;G.verse=null;
  journal('stumble');
  burst(p.x,p.y-14,10,'#ffe9a8',70,1);
}
function respawn(){
  const p=G.p,lv=G.lv;p.x=G.cp.x;p.y=G.cp.y;p.vx=p.vy=0;p.riding=null;p.sinkOff=0;G.faith=100;sfx('grace');
  for(let r=0;r<lv.H;r++)for(let c=0;c<lv.W;c++)if(lv.tiles[r][c]==='c'){lv.tiles[r][c]='C';lv.cr[r*lv.W+c]=0;}
  if(lv.storm)lv.storm.x=G.cp.x-430;
  if(lv.flood&&lv.flood.on)lv.flood.y=Math.max(lv.flood.y,G.cp.y+230);
  if(lv.giant)lv.giant.x=G.cp.x-400;
  if(lv.vigil){lv.vigil.off=0;lv.vigil.t=Math.max(0,lv.vigil.t-6);}
  for(const e of lv.ents)if(e.type==='boat'&&e.ferry){e.bx=Math.abs(G.cp.x-e.fx0)<Math.abs(G.cp.x-e.fx1)?e.fx0:e.fx1;e.rest=true;}
  for(const e of lv.ents){if(e.type==='sh'){if(e.k==='g'||e.k==='m')e.gone=true;else if(e.k==='c'||e.k==='s'){e.x=e.bx;e.y=e.by;}}}
  burst(p.x,p.y-14,14,'#fff3c0',80,1);updateCam(0,true);
}
function applyHelp(lv,e,study){
  const put=(c,hh,ch)=>{const r=lv.H-hh;if(r>=0&&r<lv.H&&c>=0&&c<lv.W)lv.tiles[r][c]=ch;};
  switch(e.kind){
    case 'ladder':for(let k=2;k<=e.hh;k+=2)put(e.c,e.gh+k,'L');if(e.hh%2)put(e.c,e.gh+e.hh,'L');break;
    case 'bridge':for(let i=0;i<e.w;i++)put(e.c0+i,e.gh,'P');break;
    case 'stone':for(let k=1;k<=3;k++){put(e.c,e.gh+k,' ');put(e.c+1,e.gh+k,' ');}break;
    case 'ferry':if(study){const b=e.boat,h=Math.round(lv.H-b.by/T);for(let x=b.fx0-b.w/2;x<=b.fx1+b.w/2;x+=T)put(Math.floor(x/T),h,'P');}break;
  }
}
function growTree(e){
  const lv=G.lv,H=e.H,c=e.c,put=(cc,hh)=>{const r=lv.H-hh;if(r>=0&&r<lv.H&&cc>=0&&cc<lv.W&&lv.tiles[r][cc]===' ')lv.tiles[r][cc]='-';};
  let i=0;for(let k=3;k<H;k+=3,i++){if(e.grow*H>=k){if(i%2===0){put(c-2,e.gh+k);put(c-1,e.gh+k);}else{put(c+1,e.gh+k);put(c+2,e.gh+k);}}}
  if(e.grow>=1)for(let d=-2;d<=2;d++)put(c+d,e.gh+H);
}
function actNeed(e){
  switch(e.type){
    case 'lost':return {dur:1.1,label:'Offer your hand'};
    case 'wand':return {dur:1.6,label:'Offer your hand',block:save.virtues[2]?null:'You do not yet know how to love an enemy.'};
    case 'gate':return {dur:1.2,label:'Forgive',block:save.virtues[3]?null:'You do not yet know how to forgive.'};
    case 'cross':return {dur:1.0,label:'Lay it down',block:save.virtues[3]?null:'You do not yet know how to let go. Look for the shrine.'};
    case 'soil':return {dur:0.7,label:'Plant a seed'};
    case 'carry':return {dur:0.7,label:e.who==='lamb'?'Lift the lamb':'Lift him up'};
    case 'door':return {dur:0.5,label:'Enter'};
    case 'hint':return {dur:0.3,label:'Read the stone again'};
    case 'help':{const f=freeFollower(),L={ladder:'Ask your friend to hold the ladder',bridge:e.art==='log'?'Lift the log across together':'Lower the bridge together',stone:'Roll the stone together',ferry:'Ask your friend to row'}[e.kind];
      return {dur:e.kind==='ferry'?0.5:1.0,label:f?L:'This takes two',block:f?null:'helper'};}
    case 'exit':return {dur:0.5,label:'Leave'};
  }return null;

// ============================================================
// REMEMBER THE WORD. After a fall, grace carries you back. Then the verse that lights this

// The words are always shown: this is remembering, not guessing.
// ============================================================
const STOPWORDS=new Set('the and of to a an in that is for you your yours he his him they them their it its be not will shall my me i we our us with as on by are was were all but have has had who whom what this from at or so when then there one into upon do no nor if am may can let out up'.split(' '));
const KB_ROWS=['qwertyuiop','asdfghjkl','zxcvbnm'];
const normWord=t=>String(t).toLowerCase().replace(/[^a-z]/g,'');
function verseTokens(k){return V(k).toLowerCase().match(/[a-z]+/g)||[];}
function wordChoices(k){const toks=verseTokens(k),set=new Set(toks);
  let c=(KEYWORDS[k]||[]).filter(w=>set.has(w));
  if(!c.length){const seen=new Set();for(const t of toks)if(t.length>=4&&t.length<=8&&!STOPWORDS.has(t)&&!seen.has(t)){seen.add(t);c.push(t);}}

// One word in the first chapters, two later, one more on the Pilgrim's Return.
function wordCount(){return Math.min(3,(G.ci<2?1:2)+(G.ng?1:0));}
function openWord(k){

  for(let i=0;i<n;i++){const w=all[(r+i)%all.length];if(pick.indexOf(w)<0)pick.push(w);}G.wordRot[k]=r+n;
  const toks=verseTokens(k);pick.sort((a,b)=>toks.indexOf(a)-toks.indexOf(b));
  G.word={k:k,words:pick,i:0,typed:'',t:0,shake:0,done:0,label:refLabel(k),hit:null,hitT:0,keys:[],sel:0,pad:false,prev:0};
  for(const id in touches)delete touches[id];mouseShine=false;for(const c in keys)keys[c]=false;
  say(V(k)+' '+sayRef(k)+'. '+(pick.length>1?'Type the words: '+pick.join(', then '):'Type the word: '+pick[0])+'.',{pri:3});
}
function typeLetter(ch){
  const W=G&&G.word;if(!W||W.done>0)return;const w=W.words[W.i];ch=String(ch).toLowerCase();W.hit=ch;W.hitT=0.18;

function finishWord(){const W=G.word;for(const w of W.words)save.words[w]=1;writeSave();journal('word');G.word=null;sfx('grace');G.cam.shake=0;}
function updateWord(dt){

      if(B(14)||ax<-0.5)m|=1;if(B(15)||ax>0.5)m|=2;if(B(12)||ay<-0.5)m|=4;if(B(13)||ay>0.5)m|=8;if(B(0))m|=16;}

function keyPos(i){let r=0;while(i>=KB_ROWS[r].length&&r<2){i-=KB_ROWS[r].length;r++;}return [r,i];}

// Lay out a verse word by word, so the words to type can glow where they stand.
function richLines(toks,maxW){const sp=ctx.measureText(' ').width,lines=[];let cur=[],cw=0;
  for(let i=0;i<toks.length;i++){const tw=ctx.measureText(toks[i]).width;if(cur.length&&cw+sp+tw>maxW){lines.push(cur);cur=[];cw=0;}cw+=(cur.length?sp:0)+tw;cur.push(i);}
  if(cur.length)lines.push(cur);return lines;}
function drawWord(){
  const W=G.word;if(!W)return;ctx.fillStyle='rgba(6,4,12,0.74)';ctx.fillRect(0,0,VW,VH);
  const w=Math.min(VW-20,680),x=VW/2-w/2,touchy=anyTouch||W.pad;

  const room=kbTop-16-bs-24-66;let fs=19,lines=null;
  for(const f of [19,17.5,16,14.5,13,12]){fs=f;font(f,'italic');lines=richLines(toks,w-36);if(lines.length*f*1.3<=room)break;}
  const lh=fs*1.3,group=lines.length*lh+24+bs,vTop=66+Math.max(0,(room+24+bs-group)/2),boxY=vTop+lines.length*lh+24;

  font(12);ctx.fillStyle='#bfe0ff';ctx.fillText(W.done>0?'Remembered. Rise, and walk on.':(touchy?'Grace carried you back. Tap the glowing letters to rise again.':'Grace carried you back. Type the glowing word to rise again.'),VW/2,50);
  if(W.words.length>1){font(11);ctx.textAlign='right';ctx.fillStyle='#e0c070';ctx.fillText('Word '+Math.min(W.i+1,W.words.length)+' of '+W.words.length,x+w-12,30);}
  font(fs,'italic');const sp=ctx.measureText(' ').width;ctx.textAlign='left';
  lines.forEach((L,li)=>{let lw=0;L.forEach((i,k)=>{lw+=(k?sp:0)+ctx.measureText(toks[i]).width;});let xx=VW/2-lw/2;const yy=vTop+li*lh+fs*0.4;
    L.forEach((i,k)=>{if(k)xx+=sp;const t=toks[i],tw=ctx.measureText(t).width,m=marks.get(i);
      if(m===undefined)ctx.fillStyle='#f6ecd0';
      else if(m<W.i)ctx.fillStyle='#b8e6a2';
      else if(m===W.i){const lead=t.match(/^[^A-Za-z]*/)[0],core=t.slice(lead.length).replace(/[^A-Za-z]+$/,''),ux=xx+ctx.measureText(lead).width,uw=ctx.measureText(core).width;
        ctx.globalCompositeOperation='lighter';glow(ctx,ux+uw/2,yy-fs*0.35,uw*0.75+12,'rgba(255,215,120,'+(0.28+0.12*Math.sin(W.t*5))+')');ctx.globalCompositeOperation='source-over';ctx.fillStyle='#ffe28a';ctx.fillRect(ux,yy+4,uw,2);}

  const n=cw.length,gap=6,tot=n*bs+(n-1)*gap,sx=VW/2-tot/2+(W.shake>0?Math.sin(W.t*70)*5*W.shake/0.35:0);

    ctx.strokeStyle=next?'rgba(255,233,168,'+(0.65+0.35*Math.sin(W.t*7))+')':done?'#ffe9a8':'rgba(233,217,168,0.4)';ctx.lineWidth=next?2.2:1.2;ctx.stroke();
    font(Math.round(bs*0.62));ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=done?'#fff6dc':next?'rgba(255,240,200,0.75)':'rgba(233,217,168,0.42)';ctx.fillText(cw.charAt(i).toUpperCase(),bx+bs/2,boxY+bs/2+1);ctx.textBaseline='alphabetic';}

function wordTap(qx,qy){const W=G&&G.word;if(!W)return false;for(const k of W.keys)if(qx>=k.x-2&&qx<=k.x+k.w+2&&qy>=k.y-2&&qy<=k.y+k.h+2){typeLetter(k.ch);return true;}return true;}

// ============================================================
// DRAWING. Backgrounds, tiles, figures, light and dark.
// ============================================================
function makeLayer(color,style,base,amp,seed){

  const hgt=x=>{const u=x/720*TAU;let v=Math.sin(u*2+ph[0])*0.5+Math.sin(u*5+ph[1])*0.3+Math.sin(u*9+ph[2])*0.2;
    if(style==='mesa')v=Math.round(v*2.5)/2.5;if(style==='jag')v=Math.abs(Math.sin(u*3+ph[0]))*1.3-0.6+Math.sin(u*14+ph[1])*0.2;return base-v*amp;};

function buildBG(ci){

function drawBG(ci,camx,yoff){

function pauseGame(){if(state==='play'){go('pause');}}
function uiTap(px,py){
  const qx=(px-OX)/SC,qy=(py-OY)/SC;
  if(state==='play'){
    if(G.word)return wordTap(qx,qy);
    if(G.vcard){G.vcard.skip=true;return true;}
    if(G.ending){G.ending.skip=true;return true;}
    const b=G.pauseBtn;if(b&&Math.hypot(qx-b.x,qy-b.y)<b.r+8){pauseGame();return true;}
    const h=G.helpBtn;if(h&&Math.hypot(qx-h.x,qy-h.y)<h.r+6){openControls('play');return true;}
    return false;}
  if(state==='card'){cardAdvance();return true;}
  if(state==='finale'&&FIN&&FIN.ph<4){finAdvance();return true;}
  for(let i=0;i<ui.btns.length;i++){const b=ui.btns[i];if(!b.dis&&qx>=b.x&&qx<=b.x+b.w&&qy>=b.y&&qy<=b.y+b.h){ui.sel=i;sfx('ui');b.fn();return true;}}
  return true;
}
function keyPress(code){
  if(code==='KeyM'){setMute(!save.mute);return;}
  if(state==='play'){if(code==='Escape'||code==='KeyP')pauseGame();else if(code==='KeyH'||code==='Slash')openControls('play');return;}
  if(code==='KeyH'||code==='Slash'){if(state==='title')openControls('title');else if(state==='pause')openControls('pause');else if(state==='controls'&&ui.back)ui.back();return;}
  const goKey=code==='Enter'||code==='Space'||code==='NumpadEnter';
  if(state==='card'){if(goKey||code==='KeyX'||code==='KeyC'||code==='ArrowRight')cardAdvance();return;}
  if(state==='finale'&&FIN&&FIN.ph<4){if(goKey||code==='ArrowRight')finAdvance();return;}
  const n=ui.btns.length;if(!n)return;
  const step=d=>{for(let k=0;k<n;k++){ui.sel=(ui.sel+d+n)%n;if(!ui.btns[ui.sel].dis)break;}sfx('ui');};
  if(code==='ArrowDown'||code==='ArrowRight'||code==='KeyS'||code==='KeyD')step(1);
  else if(code==='ArrowUp'||code==='ArrowLeft'||code==='KeyW'||code==='KeyA')step(-1);
  else if(goKey){const b=ui.btns[ui.sel];if(b&&!b.dis){sfx('ui');b.fn();}}
  else if(code==='Escape'||code==='KeyP'){if(ui.back)ui.back();}
}

cv.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches){const o=touches[t.identifier];if(o){o.x=t.clientX;o.y=t.clientY;}}},{passive:false});
const tEnd=e=>{e.preventDefault();for(const t of e.changedTouches)delete touches[t.identifier];};
cv.addEventListener('touchend',tEnd,{passive:false});cv.addEventListener('touchcancel',tEnd,{passive:false});
let lastTouchT=0;cv.addEventListener('touchstart',()=>{lastTouchT=Date.now();},{passive:true});
cv.addEventListener('mousedown',e=>{if(Date.now()-lastTouchT<700)return;initAudio();if(!uiTap(e.clientX,e.clientY)&&state==='play')mouseShine=true;});
addEventListener('mouseup',()=>{mouseShine=false;});
cv.addEventListener('mousemove',e=>{if(state==='play'||anyTouch)return;const qx=(e.clientX-OX)/SC,qy=(e.clientY-OY)/SC;for(let i=0;i<ui.btns.length;i++){const b=ui.btns[i];if(!b.dis&&qx>=b.x&&qx<=b.x+b.w&&qy>=b.y&&qy<=b.y+b.h){ui.sel=i;break;}}});
for(const ev of ['gesturestart','gesturechange','dblclick','contextmenu'])document.addEventListener(ev,e=>{if(!(acctUI.open&&e.target&&e.target.closest&&e.target.closest('#acct')))e.preventDefault();},{passive:false});

// ---- Main loop ----
let lastT=0;
function frame(ts){
  requestAnimationFrame(frame);
  let dt=(ts-lastT)/1000;lastT=ts;if(!(dt>0))dt=0.016;if(dt>0.05)dt=0.05;
  pollInput();musicTick();ui.t+=dt;
  if(state==='play'){const n=dt>0.02?2:1;for(let i=0;i<n&&state==='play';i++){updatePlay(dt/n);inp.jumpP=false;inp.actP=false;}}
  else if(state==='finale')updateFinale(dt);
  else if(state==='card'&&CARD){CARD.t+=dt;CARD.lt+=dt;}
  if(state!=='play'&&state!=='finale')music.swell=Math.max(0,music.swell-dt*0.3);
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.fillStyle='#07060c';ctx.fillRect(0,0,CW,CH);
  ctx.save();ctx.translate(OX,OY);ctx.scale(SC,SC);ctx.beginPath();ctx.rect(0,0,VW,VH);ctx.clip();
  ui.btns=[];
  switch(state){
    case 'title':drawTitle();break;
    case 'map':drawMap();break;
    case 'virtues':drawVirtues();break;
    case 'scrolls':drawScrolls();break;
    case 'journal':drawJournal();break;
    case 'about':drawAbout();break;
    case 'controls':if(ctrlFrom!=='title')drawWorld();drawControls();break;
    case 'sound':drawSound();break;
    case 'card':drawCard();break;
    case 'play':drawWorld();drawHUD();break;
    case 'pause':drawWorld();drawPause();break;
    case 'complete':drawWorld();drawComplete();break;
    case 'finale':drawFinale();break;
  }
  if(ui.sel>=ui.btns.length)ui.sel=0;
  ctx.restore();
  if(state==='play'&&G&&G.verse&&!G.ending&&!G.vcard&&!G.word&&verseBelowRoom())drawVerseBelow();
  if(state==='play'&&anyTouch&&!G.vcard&&!G.word)drawTouch();
  if(portrait&&state!=='play'){ctx.setTransform(DPR,0,0,DPR,0,0);ctx.font='13px '+FONT;ctx.fillStyle='rgba(233,217,168,0.75)';ctx.textAlign='center';ctx.fillText('Turn your phone sideways for the best view',CW/2,OY+VH*SC+30);}
  const hd=state==='title'?'':'none';if(homeLink.style.display!==hd)homeLink.style.display=hd;
}
loadSave();startCloud();resize();setMusic('title');
window.__lamp={
  get state(){return {screen:state,mode:runMode,play:G,save:save};},
  startStage:function(ci,si){runMode='pilgrim';startStage(ci,si);},
  startReturn:function(ci,si){runMode='return';startStage(ci,si);},
  unlockAll:function(){save.unlocked=17;save.retUnlocked=17;save.virtues=[true,true,true,true];save.finished=true;save.started=true;writeSave();},
  finale:function(){startFinale();},
  enterRoom:function(){if(G&&!G.room)enterRoom();},
  screen:function(s){go(s);},card:function(ci,kind){showCard(ci,kind,function(){go('title');});},
  verses:VERSES,stages:NUM_STAGES,
  // Test hooks for the level checker: build any stage and drive the real movement code without drawing it.
  dev:{
    build:function(ci,si){const st=CHAP[ci].stages[si];const lv=buildLevel(st.build,st.rows);prepLevel(lv,ci,si,false,false);return lv;},
    buildRoom:function(key){const lv=buildLevel(ROOMS[key],20);prepLevel(lv,+key[0],+key[2],false,true);return lv;},
    rooms:function(){return Object.keys(ROOMS);},
    begin:function(lv,ci,si){for(let v=0;v<4;v++)save.virtues[v]=v<ci;
      G={ci:ci,si:si,lv:lv,main:lv,room:false,ch:CHAP[ci],st:CHAP[ci].stages[si]||{},ng:false,t:0,time:0,calm:0,dawn:0,parts:[],followers:[],trail:[],cam:{x:0,y:0,shake:0},cp:{x:lv.startX,y:lv.startY},wind:0};return G;},
    virtues:function(v){for(let i=0;i<4;i++)save.virtues[i]=!!v[i];},
    end:function(){G=null;},
    newPlayer:function(lv){return newPlayer(lv);},
    growAll:function(lv){for(const e of lv.ents)if(e.type==='soil'&&!e.great){e.planted=true;e.grow=1;growTree(e);}if(lv.grow){lv.grow.on=true;lv.grow.y=0;}},
    stepMove:stepMove,moveX:moveX,moveY:moveY,applyHelp:applyHelp,solid:solid,oneWay:oneWay,tileCh:tileCh,T:T
  },
  get account(){return {name:acct.name,signedIn:!!acct.token,pending:acct.pending,status:acctStatus()};},
  openAccount:function(){openAccount();},syncNow:function(){return pushSync();}
};
requestAnimationFrame(frame);
})();
</script>
