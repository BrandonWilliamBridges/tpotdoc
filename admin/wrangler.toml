# Private analytics dashboard for Yv'e at https://admin.tpotdoc.com
# A Cloudflare Worker (free plan). Cloudflare Access sits in front of it, so only approved emails can sign in.
name = "tpotdoc-admin"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = false
routes = [{ pattern = "admin.tpotdoc.com", custom_domain = true }]

[vars]
# Filled in during setup (see admin/README.md).
ACCOUNT_ID = "3e0ad8d8518af7d57605a241e23f7562"
SITE_TAG = "59c439b13dd34a289477be8eba5cd760"  # Web Analytics site tag for tpotdoc.com (not the public beacon token)
ACCESS_TEAM_DOMAIN = "tpotdoc.cloudflareaccess.com"  # Zero Trust team domain
ACCESS_AUD = "5c9950cedcc1dd8d589c8491c38bda5c1b064896b4f27225dd72f1d1ef339d33"  # Application Audience (AUD) tag of the Access app for admin.tpotdoc.com

# Secret (never in this file): CF_API_TOKEN, a read-only token with "Account Analytics: Read".
#   npx wrangler secret put CF_API_TOKEN
