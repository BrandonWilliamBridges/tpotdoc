// ---------- playing ----------
function startLevel(idx,mode,snap){
  audioInit();
  const G=newGame(idx,mode,modsFromSave());A.G=G;A.sel=null;A.placing=null;A.hover=null;hidePopup();
  if(snap)restore(G,snap);
  for(const k in save.codex)G.seen[k]=1;
  BG=null;R_.P=[];R_.F=[];R_.repairAnim=[0,0,0,0];
  showScreen(null);resize();buildPalette();hideSel();updateHUD(true);
  save.inProgress={idx,mode,snap:snapshot(G)};writeSave();
  const nm=idx<0?'Night Watch':G.cfg.name;
  toast('<b>'+esc(nm)+'</b>'+(mode==='vigil'?' · Vigil: '+esc(VIGILS.find(v=>v.id===G.vigil).name):''),'',2600);
  const nh=TOWER_ORDER.find(t=>TOWERS[t].unlock===idx&&idx>0);
  if(nh&&mode==='story'&&!save.helpers[nh]){save.helpers[nh]=1;writeSave();setTimeout(()=>toast('New helper: <b>'+TOWERS[nh].name+'</b>. '+esc(TOWERS[nh].blurb),'',7000),900);}
  A.coach=(idx===0&&mode==='story'&&!save.coach.done&&!snap)?0:-1;
  if(A.coach===0)coach('Tap an open patch of sand next to the road, then choose <b>Watchman</b>.<br><small>Keyboard: press 1, then click a spot.</small>');else coach(null);
}
function resumeLevel(){const ip=save.inProgress;if(!ip||!ip.snap){openMap();return;}
  if(ip.idx>=0&&!LEVELS[ip.idx]){save.inProgress=null;writeSave();openMap();return;}
  startLevel(ip.idx,ip.mode,ip.snap);toast('Back at wave '+(A.G.wave+1)+'. Start it when you are ready.','',3000);}

function buildPalette(){
  const p=$('palette');p.innerHTML='';const G=A.G;
  for(const type of TOWER_ORDER){const def=TOWERS[type];const allowed=towerAllowed(G,type);
    const locked=G.idx>=0&&def.unlock>G.idx&&G.mode!=='vigil';
    if(G.idx>=0&&def.unlock>Math.max(G.idx,save.unlocked)&&G.mode!=='endless')continue;
    const b=document.createElement('button');b.className='tbtn'+(locked?' locked':'');b.dataset.type=type;
    b.innerHTML='<canvas width="76" height="76"></canvas><span>'+esc(def.name)+'</span><span class="c">'+(locked?'Later':towerCost(G,type))+'</span><span class="key">key '+def.key+'</span>';
    b.title=def.name+': '+def.blurb;
    b.onclick=()=>{audioInit();if(!towerAllowed(A.G,type)){sfx('no');toast(locked?def.name+' joins you at a later gate.':'Not allowed in this Vigil.');return;}choosePlacing(type);};
    p.appendChild(b);miniIcon(b.querySelector('canvas'),type);}
}
function miniIcon(cv,type,tier,master){const x=cv.getContext('2d');x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,cv.width,cv.height);x.setTransform(cv.width*.42,0,0,cv.width*.42,cv.width/2,cv.height/2);drawTowerIcon(x,type,1,tier||0,!!master,1.3,{flat:true});}
function choosePlacing(type){
  if(A.placing===type){A.placing=null;}else{A.placing=type;A.sel=null;hideSel();}
  hidePopup();refreshPalette();
  if(A.placing&&A.popupTile){const t=A.popupTile;}
  if(A.placing)toast('Place a '+TOWERS[type].name+': tap open sand. '+esc(TOWERS[type].blurb),'',3200);
}
function refreshPalette(){const G=A.G;if(!G)return;document.querySelectorAll('#palette .tbtn').forEach(b=>{const t=b.dataset.type;b.classList.toggle('sel',A.placing===t);
  const ok=towerAllowed(G,t)&&G.stones>=towerCost(G,t);b.disabled=false;b.style.opacity=towerAllowed(G,t)?(ok?1:.55):.3;});}

function hidePopup(){$('popup').classList.remove('show');A.popupTile=null;}
function placePopup(el,c,r){
  const st=$('stage').getBoundingClientRect();const p=toScreen(c+.5,r+.5);
  el.style.left='0px';el.style.top='0px';el.classList.add('show');
  const w=el.offsetWidth,h=el.offsetHeight;let x=p.x-w/2,y=p.y+V.s*.6;if(y+h>st.height-4)y=p.y-V.s*.6-h;
  x=clamp(x,4,st.width-w-4);y=clamp(y,4,st.height-h-4);el.style.left=x+'px';el.style.top=y+'px';}
function openBuildPopup(c,r){
  const G=A.G;const el=$('popup');el.innerHTML='<div class="pop-t">Build here</div>';A.popupTile={c,r};
  let n=0;
  for(const type of TOWER_ORDER){if(!towerAllowed(G,type))continue;n++;const cost=towerCost(G,type);
    const b=document.createElement('button');b.className='tbtn';b.innerHTML='<canvas width="76" height="76"></canvas><span>'+esc(TOWERS[type].name)+'</span><span class="c">'+cost+'</span>';
    b.disabled=G.stones<cost||(G.vigil==='few'&&G.towers.length>=6);
    b.onclick=(ev)=>{ev.stopPropagation();doBuild(type,c,r);};el.appendChild(b);miniIcon(b.querySelector('canvas'),type);}
  if(G.vigil==='few')el.insertAdjacentHTML('beforeend','<div class="small" style="color:#FFE7A8;width:100%;padding:0 4px">Few Hands: '+G.towers.length+' of 6 helpers</div>');
  placePopup(el,c,r);
}
function openWallPopup(){
  const G=A.G;const el=$('popup');const c=repairCost(G);
  el.innerHTML='<div class="pop-t">The wall · '+G.sections+' of 4 sections repaired</div>';
  const b=document.createElement('button');b.className='hbtn go';b.textContent=c==null?'The wall here is whole':'Repair a section ('+c+' stones)';b.disabled=c==null||G.stones<c;
  b.onclick=(ev)=>{ev.stopPropagation();doRepair();hidePopup();};el.appendChild(b);
  el.insertAdjacentHTML('beforeend','<div class="small" style="color:#FFE7A8;width:100%;padding:2px 4px">Each section adds 4 Resolve and a tenth more stones after every wave. All four set the gate\'s doors.</div>');
  A.popupTile={c:15,r:G.cfg.gate};placePopup(el,14,G.cfg.gate);
}
function doBuild(type,c,r){const G=A.G;const res=build(G,type,c,r);
  if(typeof res==='string'){sfx('no');toast(esc(res));}else{hidePopup();if(!A.kbd)A.placing=null;refreshPalette();if(A.coach===0){A.coach=1;coach('Good. Add another helper or two, then tap <b>Start wave</b>.<br><small>Keyboard: Space</small>');}}}
function doRepair(){const r=repair(A.G);if(r!==true){sfx('no');toast(esc(r));}}

function showSel(){
  const t=A.sel,G=A.G,el=$('sel');if(!t||!G){hideSel();return;}
  const def=TOWERS[t.type];const s=towerStats(G,t);const uc=upgradeCost(G,t);
  const rank=t.master?'Master: '+def.master.title:'Rank '+(t.tier+1)+' of 3';
  let next='';if(uc!=null){const f={type:t.type,tier:t.tier<2?t.tier+1:2,master:t.tier>=2,boost:t.boost,dmgBoost:t.dmgBoost};next=' · Next: '+statLine(G,f,towerStats(G,f))+(t.tier>=2?' ('+def.master.desc+')':'');}
  else if(t.tier>=2&&!t.master)next=' · A fourth rank can be learned in the Workshop.';
  el.innerHTML='<canvas width="76" height="76" style="width:38px;height:38px"></canvas><div><div class="nm">'+esc(def.name)+'</div><div class="small" style="color:#FFE7A8">'+esc(rank)+'</div></div>'+
   '<div class="st">'+esc(statLine(G,t,s))+esc(next)+(t.kills?' · '+t.kills+' turned to light':'')+'</div>'+
   (uc!=null?'<button class="hbtn go" id="sUp">Upgrade ('+uc+')</button>':'')+
   (['bolt','beam'].includes(def.kind)?'<button class="hbtn" id="sMode" title="Who to aim at (T)">Aim: '+TARGET_NAMES[t.mode]+'</button>':'')+
   '<button class="hbtn" id="sSell" title="Take down (X)">Take down (+'+sellValue(t)+')</button><button class="hbtn" id="sX" title="Close">✕</button>';
  miniIcon(el.querySelector('canvas'),t.type,t.tier,t.master);
  if($('sUp')){$('sUp').disabled=G.stones<uc;$('sUp').onclick=()=>doUpgrade();}
  if($('sMode'))$('sMode').onclick=()=>cycleMode();
  $('sSell').onclick=()=>doSell();$('sX').onclick=()=>{A.sel=null;hideSel();};
  el.classList.add('show');A.selSig=selSig();
}
function selSig(){const t=A.sel;return t?[t.id,t.tier,t.master,t.mode,A.G.stones>=(upgradeCost(A.G,t)||1e9),t.kills,t.boost].join('|'):'';}
function hideSel(){$('sel').classList.remove('show');$('sel').innerHTML='';}
function statLine(G,t,s){const r=s.range?(' · reach '+s.range.toFixed(1)):'';
  switch(t.type){
    case 'watch':return 'Light '+Math.round(s.dmg)+(s.multi?' twice':'')+' · '+s.rate.toFixed(1)+' a second'+r;
    case 'trumpet':return 'Blast '+Math.round(s.dmg)+' to all nearby · slows '+Math.round(s.slow*100)+'%'+(s.stun?' and stops':'')+r;
    case 'mason':return '+'+s.income+' stones after each wave'+(s.heal?' · mends '+s.heal+' Resolve':'');
    case 'choir':return 'Nearby helpers work '+Math.round(s.boost*100)+'% faster'+(s.dmgBoost?' and '+Math.round(s.dmgBoost*100)+'% harder':'')+r;
    case 'scribe':return 'Truth '+Math.round(s.dmg)+' through armor'+(s.pierce?', through every shadow in line':'')+' · shows Rumors'+r;
    case 'keeper':return 'Slows '+Math.round(s.slow*100)+'% · fades '+Math.round(s.dps)+' a second'+(s.mark?' · marked shadows take 25% more':'')+r;
  }return '';}
function doUpgrade(){const t=A.sel;if(!t)return;const r=upgrade(A.G,t);if(typeof r==='string'){sfx('no');toast(esc(r));}showSel();}
function doSell(){const t=A.sel;if(!t)return;sell(A.G,t);A.sel=null;hideSel();refreshPalette();}
function cycleMode(){const t=A.sel;if(!t)return;const m=['first','strong','close'];t.mode=m[(m.indexOf(t.mode)+1)%3];showSel();}

function updateHUD(force){
  const G=A.G;if(!G)return;const c=A.hudCache;
  const set=(id,v,prop)=>{if(force||c[id]!==v){c[id]=v;if(prop==='w')$(id).style.width=v;else $(id).textContent=v;}};
  set('hLvl',G.idx<0?'Night Watch':G.cfg.name+(G.mode==='vigil'?' · Vigil':''));
  set('hRes',Math.ceil(G.resolve)+'');set('hResBar',Math.max(0,G.resolve/G.maxResolve*100)+'%','w');
  set('hSt',Math.floor(G.stones)+'');
  set('hWave',G.idx<0?(G.wave+(G.waveActive?1:0))+'':Math.min(G.waves,G.wave+(G.waveActive?1:0))+'/'+G.waves);
  const rc=repairCost(G);set('bRepair',rc==null?'Wall whole':'Repair wall · '+rc);
  const rb=$('bRepair');const rd=rc==null||G.stones<rc;if(rb.disabled!==rd)rb.disabled=rd;
  let wl;if(G.waveActive)wl='Wave '+(G.wave+1)+'…';else if(G.autoT>0)wl='Next in '+Math.ceil(G.autoT);else wl='Start wave '+(G.wave+1);
  set('bWave',wl);const wb=$('bWave');const wd=G.waveActive||G.over;if(wb.disabled!==wd)wb.disabled=wd;wb.classList.toggle('pulse',!wd);
  set('bSpeed',save.speed+'×');
  const sig=G.stones+'|'+G.towers.length;if(force||c.pal!==sig){c.pal=sig;refreshPalette();}
  if(A.sel&&selSig()!==A.selSig)showSel();
}

// ---------- events from the game ----------
function saveBetween(G){if(!G.waveActive&&!G.over){save.inProgress={idx:G.idx,mode:G.mode,snap:snapshot(G)};writeSave();}}
function handleEvents(){
  const G=A.G;if(!G)return;const evs=G.events;G.events=[];
  for(const ev of evs){
    switch(ev.type){
      case 'build':sfx('build');saveBetween(G);addBurst(ev.t.x,ev.t.y+.2,'#D4B585',10,.8);if(!save.helpers[ev.t.type]){save.helpers[ev.t.type]=1;writeSave();}break;
      case 'upgrade':sfx('up');saveBetween(G);addBurst(ev.t.x,ev.t.y,'#FFD46E',16,1.2);addFloat(ev.t.x,ev.t.y-.3,ev.t.master?'Master!':'Rank '+(ev.t.tier+1));break;
      case 'sell':saveBetween(G);addFloat(ev.t.x,ev.t.y,'+'+ev.v,'#FFE7A8');addBurst(ev.t.x,ev.t.y,'#D4B585',8,.6);break;
      case 'repair':sfx('repair');saveBetween(G);R_.repairAnim[ev.n-1]=1;addBurst(15.5,SECTION_ROWS[ev.n-1][0]+.8,'#D9BE8C',18,1.4);
        toast('Wall section '+ev.n+' of 4 rebuilt: +4 Resolve, and more stones after every wave.','',3000);
        if(A.coach===3){A.coach=4;coach(null);}break;
      case 'doors':sfx('doors');toast('<b>The doors are set</b>, with bolts and bars. This gate is whole.','',4200);break;
      case 'waveStart':sfx('wave');if(ev.boss)toast('<b>'+esc(ENEMIES[ev.boss].name)+'</b> is coming. '+esc(ENEMIES[ev.boss].blurb),'',6000);
        save.inProgress={idx:G.idx,mode:G.mode,snap:G.snap};writeSave();
        if(A.coach===1){A.coach=2;coach('Shadows that reach the gate cost Resolve. Your helpers turn them back into light.');}
        if(A.coach===3){A.coach=4;coach(null);}break;
      case 'kill':sfx('kill');addBurst(ev.e.x,ev.e.y,ev.e.def.boss?'#FFE7A8':'#FFD46E',ev.e.def.boss?40:9,ev.e.def.boss?2:1);if(R_.F.length<14||ev.e.def.boss)addFloat(ev.e.x,ev.e.y-.2,'+'+ev.rw);
        if(ev.e.def.boss)toast('<b>'+esc(ev.e.def.name)+'</b> has dissolved into light.','',3500);break;
      case 'leak':sfx('leak');R_.shake=1;R_.leakFlash=1;addFloat(15.2,G.cfg.gate+.5,'−'+ev.e.def.harm,'#FF9C8A');break;
      case 'shoot':sfx('shoot');break;
      case 'pulse':sfx('pulse');break;
      case 'beam':sfx('beam');break;
      case 'newEnemy':if(!save.codex[ev.etype]){save.codex[ev.etype]=1;writeSave();const d=ENEMIES[ev.etype];if(!d.boss&&ev.etype!=='mote')toast('New shadow: <b>'+esc(d.name)+'</b>. '+esc(d.blurb),'',6500);}break;
      case 'waveEnd':sfx('clear');
        for(const t of G.towers)if(t.type==='mason'){const s=towerStats(G,t);addFloat(t.x,t.y-.3,'+'+s.income,'#FFE7A8');addBurst(t.x,t.y,'#CFC3B2',8,.8);}
        if(!G.won)toast('Wave '+ev.n+' cleared: +'+ev.bonus+' stones'+(ev.income?', +'+ev.income+' from Stonemasons':'')+(ev.heal?', +'+ev.heal+' Resolve':''),'',2800);
        if(!G.won){save.inProgress={idx:G.idx,mode:G.mode,snap:snapshot(G)};writeSave();}
        if(A.coach===2){A.coach=3;coach('Between waves: tap a helper to <b>upgrade</b> it, or tap <b>Repair wall</b>. Each section adds Resolve, and all four earn a star.');}
        break;
      case 'midVerse':{const id=G.cfg.v[1];const v=VERSES[id];seeVerse(id);toast(esc(v[1])+'<b>'+esc(v[0])+'</b>','verse',11000);break;}
      case 'milestone':toast('Wave '+ev.n+' held: <b>+1 Hope</b>','',3500);break;
      case 'victory':setTimeout(()=>onVictory(G),900);break;
      case 'defeat':setTimeout(()=>onDefeat(G),700);break;
    }
  }
}

// ---------- results ----------
function onVictory(G){
  if(A.G!==G)return;sfx('win');coach(null);A.sel=null;hideSel();
  const card=$('resultCard');const idx=G.idx;
  if(G.mode==='vigil'){const first=!save.vigil[idx];save.vigil[idx]=1;save.inProgress=null;writeSave();
    card.innerHTML='<div class="sub">'+esc(G.cfg.name)+'</div><h2>Vigil kept</h2><p>You kept watch through '+esc(VIGILS.find(v=>v.id===G.vigil).name)+'. '+(first?'<b>+1 Hope.</b> A blue seal now marks this gate on the map.':'You had kept this one before.')+'</p>'+verseHTML(G.cfg.v[2])+
    '<div class="row"><button class="btn pri full" id="rMap">Back to the map</button></div>';
    showScreen('resultScr');$('rMap').onclick=()=>openMap();return;}
  const stars=starsFor(G);const old=save.stars[idx]||0;if(stars>old)save.stars[idx]=stars;
  const wasUnlocked=save.unlocked;save.unlocked=Math.max(save.unlocked,Math.min(10,idx+1));
  save.inProgress=null;if(!save.coach.done&&idx===0)save.coach.done=1;
  const firstFinal=idx===10&&!save.finished;if(idx===10)save.finished=true;
  writeSave();
  const gained=Math.max(0,stars-old);
  const newHelper=TOWER_ORDER.find(t=>TOWERS[t].unlock===idx+1);
  const why=[];why.push('★ Gate rebuilt');why.push((G.resolve>=G.maxResolve*.6?'★':'☆')+' At least 60% Resolve left ('+Math.ceil(G.resolve)+' of '+G.maxResolve+')');
  why.push((G.sections>=4&&G.retries===0?'★':'☆')+' All four wall sections repaired'+(G.retries?' (a wave was tried again)':' ('+G.sections+' of 4)'));
  card.innerHTML='<div class="sub">Chapter '+(G.cfg.ch+1)+': '+esc(CHAPTERS[G.cfg.ch])+'</div><h2>'+esc(G.cfg.name)+(idx===10?' : the wall is finished!':' is rebuilt!')+'</h2>'+
   '<p style="font-size:30px;margin:2px 0 6px">'+starsHTML(stars)+'</p><p class="small">'+why.join('<br>')+'</p>'+
   '<p>'+esc(G.cfg.outro)+'</p>'+verseHTML(G.cfg.v[2])+
   '<div class="kv"><b>Shadows turned to light</b><span>'+G.kills+'</span><b>Helpers on the wall</b><span>'+G.towers.length+'</span>'+
   (gained?'<b>Hope</b><span>+'+gained+' (spend it in the Workshop)</span>':'')+
   (newHelper&&wasUnlocked<idx+1?'<b>New helper</b><span>'+esc(TOWERS[newHelper].name)+' joins you at the next gate</span>':'')+
   (idx<10&&wasUnlocked<idx+1?'<b>Unlocked</b><span>'+esc(LEVELS[idx+1].name)+', and this gate\'s Vigil</span>':'')+'</div>'+
   '<div class="row">'+(idx<10?'<button class="btn pri full" id="rNext">Next: '+esc(LEVELS[idx+1].name)+'</button>':'<button class="btn pri full" id="rNext">Continue</button>')+
   '<button class="btn ghost" id="rMap">Map</button><button class="btn ghost" id="rAgain">Play again</button></div>';
  showScreen('resultScr');
  $('rMap').onclick=()=>{firstFinal?showEnding():openMap();};
  $('rAgain').onclick=()=>startLevel(idx,'story');
  $('rNext').onclick=()=>{if(idx<10)openBrief(idx+1);else if(firstFinal)showEnding();else openMap();};
}
function onDefeat(G){
  if(A.G!==G)return;coach(null);A.sel=null;hideSel();
  const card=$('resultCard');
  if(G.mode==='endless'){const best=Math.max(save.endlessBest||0,G.wave);const gained=G.endlessHope;
    save.endlessBest=best;save.endlessHope=Math.min(10,(save.endlessHope|0)+0);save.inProgress=null;writeSave();
    card.innerHTML='<h2>The Night Watch ends</h2><p>You held the gate through <b>'+G.wave+'</b> waves. Your best is '+best+'.</p>'+verseHTML('n13_31')+
      '<div class="row"><button class="btn pri full" id="rAgain">Keep watch again</button><button class="btn ghost" id="rMap">Map</button></div>';
    showScreen('resultScr');$('rAgain').onclick=()=>startLevel(-1,'endless');$('rMap').onclick=()=>openMap();return;}
  const g=GRACE[Math.floor(Math.random()*GRACE.length)];
  card.innerHTML='<h2>The work paused</h2><p>Resolve ran out during wave '+(G.wave+1)+'. That happens to every builder. Everything you built is still standing.</p>'+verseHTML(g)+
   '<div class="row"><button class="btn pri full" id="rRetry">Try wave '+(G.wave+1)+' again</button><button class="btn ghost" id="rRestart">Start the gate over</button><button class="btn ghost" id="rMap">Map</button></div>'+
   '<p class="small" style="margin-top:8px">Trying a wave again puts everything back the way it was when the wave began. The third star needs a run with no retries.</p>';
  showScreen('resultScr');
  $('rRetry').onclick=()=>{if(A.G!==G)return;restore(G,G.snap);G.retries++;G.events=[];R_.P=[];showScreen(null);updateHUD(true);buildPalette();};
  $('rRestart').onclick=()=>startLevel(G.idx,G.mode);
  $('rMap').onclick=()=>openMap();
}
function endlessTick(){const G=A.G;if(G&&G.mode==='endless'&&G.endlessHope){const room=10-(save.endlessHope|0);const add=Math.min(room,G.endlessHope);if(add>0){save.endlessHope=(save.endlessHope|0)+add;}G.endlessHope=0;save.endlessBest=Math.max(save.endlessBest||0,G.wave);writeSave();}}
function showEnding(){
  showStory([
    {kicker:'The twenty-fifth day of Elul',title:'Fifty-two days',html:verseHTML('n6_15')+verseHTML('n6_16')+'<p>The mockers had said it could not be done. It was done, and everyone could see who had really done it.</p>'},
    {kicker:'At the Water Gate',title:'The joy of the LORD',html:'<p>The people gather in the square before the Water Gate. Ezra the scribe reads the Law from early morning until midday, and the Levites explain it so that everyone understands. The people weep. Nehemiah tells them not to.</p>'+verseHTML('n8_10')},
    {kicker:'On top of the wall',title:'The dedication',html:'<p>Two great choirs climb onto the wall and walk around it in opposite directions, singing, until they meet at the temple.</p>'+verseHTML('n12_27')+verseHTML('n12_43')},
    {kicker:'A wall that lasts',title:'The repairer of the breach',html:'<p>Nehemiah\'s wall was stone, and stone wears down. But God had promised something deeper through Isaiah.</p>'+verseHTML('i58_12')+
      '<p>That promise points to Jesus, who builds a people instead of a wall, and is himself the cornerstone.</p>'+verseHTML('e2_19')+verseHTML('c3_11')},
    {kicker:'For you',title:'Nothing is beyond repair',html:verseHTML('r21_5')+'<p>Whatever lies in ruins, you do not rebuild alone, and you do not rebuild in your own strength.</p>'+verseHTML('ph1_6')+
      '<p><b>The Night Watch is open</b> on the Mount of Olives: endless waves, and more Hope to earn. Every gate also has a Vigil to keep.</p>',last:'Back to the map'}
  ],()=>openMap());
}

// ---------- pause, help, workshop, book, about ----------
function openPause(){
  if(!A.G)return;const G=A.G;const card=$('pauseCard');
  card.innerHTML='<h2>Paused</h2><p class="sub">'+esc(G.idx<0?'Night Watch':G.cfg.name)+' · wave '+(G.wave+(G.waveActive?1:0))+'</p>'+
  '<div class="row" style="flex-direction:column;align-items:stretch"><button class="btn pri" id="pRes">Resume</button><button class="btn" id="pHelp">Controls and help</button>'+
  '<button class="btn" id="pSnd">Sound: '+(save.sound?'on':'off')+'</button><button class="btn ghost" id="pRestart">Start this gate over</button><button class="btn ghost" id="pMap">Leave for the map (your place is saved)</button><button class="btn ghost" id="pTitle">Title screen</button></div>';
  showScreen('pauseScr');
  $('pRes').onclick=()=>showScreen(null);$('pHelp').onclick=()=>openHelp('pause');
  $('pSnd').onclick=()=>{save.sound=!save.sound;writeSave();openPause();};
  $('pRestart').onclick=()=>startLevel(G.idx,G.mode);$('pMap').onclick=()=>openMap();$('pTitle').onclick=()=>openTitle();
  $('pRes').focus();
}
let backTo=null;
function goBack(){const b=backTo;backTo=null;if(b==='pause')openPause();else if(b==='map')openMap();else if(b==='game')showScreen(null);else openTitle();}
function openHelp(from){backTo=from;const card=$('helpCard');
  card.innerHTML='<h2>How to play</h2>'+
  '<p>Shadows of discouragement walk the road toward the gate. Place helpers on open sand beside the road; they turn the shadows back into light. A shadow that reaches the gate costs <b>Resolve</b>. If Resolve runs out, the work pauses and you can try that wave again.</p>'+
  '<p>Turning shadows to light, finishing waves and Stonemasons all bring <b>stones</b>. Spend them to build, to raise a helper\'s rank, and to <b>repair the wall</b>: each of the four sections adds Resolve and more stones per wave, and all four set the gate\'s doors.</p>'+
  '<h3>Touch and mouse</h3><div class="keys"><kbd>Tap sand</kbd><span>Choose a helper to build there</span><kbd>Tap a helper</kbd><span>Upgrade it, change its aim, or take it down</span><kbd>Tap the wall</kbd><span>Repair a section</span><kbd>Bottom row</kbd><span>Pick a helper, then tap sand to place it</span><kbd>Start wave</kbd><span>Send the next wave when you are ready</span></div>'+
  '<h3>Keyboard</h3><div class="keys"><kbd>1 to 6</kbd><span>Pick a helper to place</span><kbd>Arrows or W A S D</kbd><span>Move the cursor</span><kbd>Enter</kbd><span>Build, or select the helper under the cursor</span><kbd>Space</kbd><span>Start the next wave</span><kbd>U</kbd><span>Upgrade the selected helper</span><kbd>T</kbd><span>Change its aim</span><kbd>X</kbd><span>Take it down</span><kbd>R</kbd><span>Repair the wall</span><kbd>F</kbd><span>Game speed</span><kbd>M</kbd><span>Sound on or off</span><kbd>H</kbd><span>This help</span><kbd>Escape or P</kbd><span>Cancel, or pause</span></div>'+
  '<h3>Helpers</h3><div class="list">'+TOWER_ORDER.map(t=>'<div class="item"><canvas width="88" height="88" data-t="'+t+'"></canvas><div class="t"><b>'+esc(TOWERS[t].name)+' · '+TOWERS[t].cost+' stones</b><span>'+esc(TOWERS[t].blurb)+'</span></div></div>').join('')+'</div>'+
  '<h3>Stars and Hope</h3><p>Each gate gives up to three stars. Every star is one <b>Hope</b> to spend in the Workshop on lasting help: more stones, more Resolve, stronger and farther-reaching helpers, and a fourth rank for each helper. Vigils and the Night Watch earn more Hope.</p>'+
  '<p class="small">Taking down a helper returns all its stones if no wave has started since you built it, and most of them after that. Your place is saved at the start and end of every wave.</p>'+
  '<div class="row"><button class="btn pri full" id="hBack">Back</button></div>';
  card.querySelectorAll('canvas[data-t]').forEach(c=>miniIcon(c,c.dataset.t));
  showScreen('helpScr');$('hBack').onclick=()=>goBack();$('hBack').focus();card.scrollTop=0;
}
function openShop(from){backTo=from;const card=$('shopCard');
  const draw=()=>{const left=hopeLeft();
    card.innerHTML='<h2>Workshop</h2><p>Spend Hope on lasting help. It carries into every gate, Vigil and Night Watch.</p><p><span class="pill">Hope to spend: '+left+'</span> <span class="small">'+totalHope()+' earned in all</span></p><div class="list">'+
    UPGRADES.map(u=>{const r=save.up[u.id]|0;const max=u.costs.length;const cost=r<max?u.costs[r]:null;
      return '<div class="item"><div class="t"><b>'+esc(u.name)+' <span class="pips">'+'●'.repeat(r)+'○'.repeat(max-r)+'</span></b><span>'+esc(u.desc)+(max>1?' (up to '+max+' times)':'')+'</span></div>'+
      (cost==null?'<span class="pips">Done</span>':'<button class="btn '+(left>=cost?'pri':'')+'" data-u="'+u.id+'" '+(left>=cost?'':'disabled')+'>'+cost+' Hope</button>')+'</div>';}).join('')+
    '</div><div class="row"><button class="btn pri full" id="wBack">Back</button><button class="btn ghost" id="wReset">Take back all Hope</button></div>'+
    '<p class="small" style="margin-top:8px">Earn Hope from stars at each gate, from keeping Vigils, and from the Night Watch. Taking it back lets you choose again.</p>';
    card.querySelectorAll('button[data-u]').forEach(b=>b.onclick=()=>{const u=UPGRADES.find(x=>x.id===b.dataset.u);const r=save.up[u.id]|0;if(r<u.costs.length&&hopeLeft()>=u.costs[r]){save.up[u.id]=r+1;writeSave();sfx('up');draw();}});
    $('wBack').onclick=()=>goBack();$('wReset').onclick=()=>{save.up={};writeSave();sfx('click');draw();};};
  draw();showScreen('shopScr');
}
function openBook(from,tab){backTo=from||backTo;const card=$('bookCard');
  const nv=VERSE_ORDER.filter(k=>save.verses[k]).length;
  let body='';
  if(tab==='verses'){body='<p class="small">'+nv+' of '+VERSE_ORDER.length+' verses found. Each gate, each shadow and the story itself hold more.</p><div class="list">'+
    VERSE_ORDER.map(k=>save.verses[k]?'<div class="verse" style="margin:0">'+esc(VERSES[k][1])+'<b>'+esc(VERSES[k][0])+'</b></div>':'<div class="verse locked-v" style="margin:0">Not found yet. Keep building.</div>').join('')+'</div>';}
  else if(tab==='shadows'){const ks=Object.keys(ENEMIES);body='<p class="small">Every shadow has an answer.</p><div class="list">'+ks.map(k=>{const d=ENEMIES[k];if(!save.codex[k])return '<div class="item locked-v"><div class="t"><b>Not met yet</b></div></div>';
      seeVerse(d.answer);return '<div class="item"><canvas width="88" height="88" data-e="'+k+'"></canvas><div class="t"><b>'+esc(d.name)+'</b><span>'+esc(d.blurb)+'</span><div class="verse" style="margin:6px 0 0">'+esc(VERSES[d.answer][1])+'<b>'+esc(VERSES[d.answer][0])+'</b></div></div></div>';}).join('')+'</div>';}
  else{body='<div class="list">'+TOWER_ORDER.map(t=>{const d=TOWERS[t];if(!save.helpers[t])return '<div class="item locked-v"><div class="t"><b>Not met yet</b></div></div>';seeVerse(d.verse);
      return '<div class="item"><canvas width="88" height="88" data-t="'+t+'"></canvas><div class="t"><b>'+esc(d.name)+'</b><span>'+esc(d.blurb)+'</span><div class="verse" style="margin:6px 0 0">'+esc(VERSES[d.verse][1])+'<b>'+esc(VERSES[d.verse][0])+'</b></div></div></div>';}).join('')+'</div>';}
  card.innerHTML='<h2>Book of Remembrance</h2><div class="tabs"><button data-tab="verses" class="'+(tab==='verses'?'on':'')+'">Verses</button><button data-tab="shadows" class="'+(tab==='shadows'?'on':'')+'">Shadows</button><button data-tab="helpers" class="'+(tab==='helpers'?'on':'')+'">Helpers</button></div>'+body+
   '<div class="row"><button class="btn pri full" id="kBack">Back</button></div>';
  card.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{sfx('click');openBook(null,b.dataset.tab);card.scrollTop=0;});
  card.querySelectorAll('canvas[data-t]').forEach(c=>miniIcon(c,c.dataset.t));
  card.querySelectorAll('canvas[data-e]').forEach(c=>{const x=c.getContext('2d');x.setTransform(c.width*.9,0,0,c.width*.9,c.width/2,c.height/2);const d=ENEMIES[c.dataset.e];
    drawEnemy(x,{def:d,wob:1.2,a:0,hp:1,maxHp:1,hitT:0,stunT:0},0,false);});
  $('kBack').onclick=()=>goBack();showScreen('bookScr');
}
function openAbout(from){backTo=from;const card=$('aboutCard');
  card.innerHTML='<h2>About Watchmen on the Walls</h2><p>A tower defense game about Nehemiah rebuilding the walls of Jerusalem, told from the book of Nehemiah. Made for <a href="/">linkbridges.org</a>, for anyone who would rather build something than give up.</p>'+
  '<p>The story is told in my own words between the verses. Names, gates and events follow Nehemiah chapters 1 to 12; the shadows are pictures of the discouragements the builders faced, not the people who opposed them.</p>'+
  '<h3>Scripture</h3><p class="small">'+esc(ESV_NOTICE)+'</p><p class="small">'+esc(ESV_TRADEMARK)+'</p><p class="small">This game quotes '+VERSE_ORDER.length+' verses or verse groups.</p>'+
  '<h3>Your saved game</h3><p class="small">Progress is kept in this browser on this device. Clearing your browser data erases it.</p>'+
  '<div class="row"><button class="btn pri full" id="aBack">Back</button><button class="btn ghost" id="aWipe">Erase saved game</button></div>';
  $('aBack').onclick=()=>goBack();
  $('aWipe').onclick=()=>{if($('aWipe').dataset.sure){try{localStorage.removeItem(SAVE_KEY);}catch(e){}location.reload();}else{$('aWipe').dataset.sure=1;$('aWipe').textContent='Tap again to erase everything';}};
  showScreen('aboutScr');
}

// ---------- input ----------
function resize(){const st=$('stage');const cv=$('cv');const w=st.clientWidth,h=st.clientHeight;if(!w||!h)return;layoutView(w,h);
  const W=Math.round(w*V.dpr),H=Math.round(h*V.dpr);if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H;}BG=null;hidePopup();}
function tileAt(ev){const r=$('cv').getBoundingClientRect();const w=toWorld(ev.clientX-r.left,ev.clientY-r.top);return{c:Math.floor(w.x),r:Math.floor(w.y)};}
function tapTile(c,r){
  const G=A.G;if(!G||G.over)return;audioInit();
  const t=G.towers.find(t=>t.c===c&&t.r===r);
  if(t){hidePopup();A.placing=null;refreshPalette();A.sel=(A.sel===t?null:t);A.sel?showSel():hideSel();sfx('click');return;}
  if(A.sel){A.sel=null;hideSel();}
  if(c===15||c===16){A.placing=null;refreshPalette();openWallPopup();return;}
  if(A.placing){if(canBuild(G,c,r)){doBuild(A.placing,c,r);}else{sfx('no');}return;}
  if(canBuild(G,c,r)){if(A.popupTile&&A.popupTile.c===c&&A.popupTile.r===r){hidePopup();return;}openBuildPopup(c,r);return;}
  hidePopup();
}
function setupInput(){
  const cv=$('cv');
  cv.addEventListener('pointerdown',ev=>{A.downAt={x:ev.clientX,y:ev.clientY,t:performance.now()};if(ev.pointerType!=='mouse'){A.hover=tileAt(ev);}});
  cv.addEventListener('pointermove',ev=>{if(ev.pointerType==='mouse'){A.hover=tileAt(ev);A.kbd=false;}});
  cv.addEventListener('pointerleave',()=>{if(!A.kbd)A.hover=null;});
  cv.addEventListener('pointerup',ev=>{const d=A.downAt;A.downAt=null;if(!d)return;if(Math.hypot(ev.clientX-d.x,ev.clientY-d.y)>14)return;const t=tileAt(ev);A.kbd=false;
    if(ev.pointerType!=='mouse')A.hover=t;if(ev.shiftKey&&A.placing){const G=A.G;if(canBuild(G,t.c,t.r)){build(G,A.placing,t.c,t.r);return;}}tapTile(t.c,t.r);});
  cv.addEventListener('contextmenu',ev=>{ev.preventDefault();A.placing=null;A.sel=null;hideSel();hidePopup();refreshPalette();});
  $('bWave').onclick=()=>{audioInit();if(A.G&&startWave(A.G)){hidePopup();}};
  $('bSpeed').onclick=()=>{save.speed=save.speed%3+1;writeSave();updateHUD(true);};
  $('bRepair').onclick=()=>{audioInit();doRepair();};
  $('bHelp').onclick=()=>openHelp('game');
  $('bMenu').onclick=()=>openPause();
  const mc=$('mapCv');
  mc.addEventListener('pointermove',ev=>{const p=mapCoords(ev);A.mapHover=mapHit(p.x,p.y,p.w,p.h);mc.style.cursor=A.mapHover!=null?'pointer':'default';});
  mc.addEventListener('click',ev=>{const p=mapCoords(ev);const i=mapHit(p.x,p.y,p.w,p.h);if(i==null)return;
    if(i===-1){if(save.stars[10])openBrief(-1);return;}if(i<=save.unlocked){sfx('click');openBrief(i);}else{sfx('no');toast('Rebuild the gates before it first.');}});
  window.addEventListener('keydown',onKey);
  window.addEventListener('resize',()=>{resize();});
  if(window.ResizeObserver)new ResizeObserver(()=>resize()).observe($('stage'));
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&A.G&&!anyScreen()&&!A.G.over)openPause();});
  document.addEventListener('pointerdown',ev=>{if(!$('popup').contains(ev.target)&&ev.target!==cv)hidePopup();},true);
}
function onKey(ev){
  const k=ev.key;
  if(anyScreen()){
    if(k==='Escape'){const s=document.querySelector('.screen.show');if(s.id==='pauseScr')showScreen(null);else if(['helpScr','shopScr','bookScr','aboutScr'].includes(s.id))goBack();else if(s.id==='briefScr')openMap();}
    return;}
  const G=A.G;if(!G)return;
  if(ev.ctrlKey||ev.metaKey||ev.altKey)return;
  const lk=k.toLowerCase();
  const moveCur=(dc,dr)=>{A.kbd=true;A.cursor.c=clamp(A.cursor.c+dc,0,16);A.cursor.r=clamp(A.cursor.r+dr,0,ROWS-1);A.hover={c:A.cursor.c,r:A.cursor.r};ev.preventDefault();};
  // arrows move in screen directions, so turn them when the field is turned
  const dir={arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0],arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1]}[lk];
  if(dir){let [dc,dr]=dir;if(V.rot){const t=dc;dc=dr;dr=-t;}moveCur(dc,dr);return;}
  if(k>='1'&&k<='6'){const type=TOWER_ORDER[+k-1];if(towerAllowed(G,type)){A.kbd=true;if(!A.hover)A.hover={c:A.cursor.c,r:A.cursor.r};choosePlacing(type);}else{sfx('no');}return;}
  switch(lk){
    case 'enter':case 'e':{const h=A.hover||A.cursor;A.kbd=true;if(A.placing&&canBuild(G,h.c,h.r)){doBuild(A.placing,h.c,h.r);}else tapTile(h.c,h.r);ev.preventDefault();break;}
    case ' ':ev.preventDefault();startWave(G);break;
    case 'u':doUpgrade();break;
    case 'x':case 'delete':case 'backspace':doSell();break;
    case 't':cycleMode();break;
    case 'r':doRepair();break;
    case 'f':save.speed=save.speed%3+1;writeSave();updateHUD(true);break;
    case 'm':save.sound=!save.sound;writeSave();toast('Sound '+(save.sound?'on':'off'));break;
    case 'h':case '?':openHelp('game');break;
    case 'escape':case 'p':if(A.placing||A.sel||$('popup').classList.contains('show')){A.placing=null;A.sel=null;hideSel();hidePopup();refreshPalette();}else openPause();break;
  }
}

// ---------- main loop ----------
function frame(ts){
  const now=ts/1000;const dt=Math.min(.05,Math.max(0,now-(A.last||now)));A.last=now;A.time+=dt;
  try{
    if($('title').classList.contains('show'))drawTitle($('titleCv'),A.time);
    if($('mapScr').classList.contains('show'))drawMap($('mapCv'),save,A.time,A.mapHover);
    const G=A.G;
    if(G){
      if(!anyScreen()&&!G.over){let rem=dt*save.speed;while(rem>1e-6){const h=Math.min(1/60,rem);update(G,h);rem-=h;if(G.events.length)handleEvents();if(G.over)break;}}
      if(G.events.length)handleEvents();
      if(G.mode==='endless')endlessTick();
      if(A.sel&&!G.towers.includes(A.sel)){A.sel=null;hideSel();}
      stepParticles(anyScreen()?0:dt);
      renderGame($('cv').getContext('2d'),G,A.time,A.hover||(A.kbd?A.cursor:null),A.placing,A.sel,A.kbd);
      updateHUD(false);
    }
  }catch(err){console.error(err);}
  requestAnimationFrame(frame);
}

// test hooks for automated checks
window.__wotw={A,save,LEVELS,VERSES,startLevel,openMap,openBrief,startWave:()=>A.G&&startWave(A.G),
  build:(t,c,r)=>doBuild(t,c,r),tick:(sec)=>{const G=A.G;let rem=sec;while(rem>0&&!G.over){update(G,1/60);rem-=1/60;handleEvents();}handleEvents();},
  tapTile,onKey:(key)=>onKey({key,preventDefault(){},ctrlKey:false,metaKey:false,altKey:false}),openShop,openBook,openHelp,openAbout,openPause,showEnding,resumeLevel};

loadSave();setupInput();resize();openTitle();requestAnimationFrame(frame);
</script>
