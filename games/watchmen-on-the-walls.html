<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="description" content="Watchmen on the Walls: a tower defense game where you rebuild the walls of Jerusalem gate by gate with Nehemiah." />
<title>Watchmen on the Walls</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
<style>
:root{
  --sand:#F3E2BF; --sand2:#E8CB97; --sand3:#D6AE6E; --terra:#C0613F; --terra2:#9E4A2F;
  --dusk:#2E2140; --dusk2:#4A3360; --plum:#6B4A7A; --gold:#F2B33D; --gold2:#FFD46E;
  --ink:#2A1D2E; --ink2:#5B4757; --cream:#FFF7E8; --olive:#6F7F3A; --teal:#2F9C95;
  --red:#C8443A; --panel:rgba(46,33,64,.92); --line:rgba(255,231,190,.22);
  --fh:'Baloo 2',system-ui,sans-serif; --fb:'Nunito',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:linear-gradient(180deg,#2E2140 0%,#5A3E63 55%,#B8644A 100%);color:var(--cream);font-family:var(--fb);
  -webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font-family:var(--fb);cursor:pointer;border:0}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
/* ---------- heads up display ---------- */
body.nogame #hud,body.nogame #bottom{visibility:hidden}
#hud{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line);z-index:5}
#hud .grp{display:flex;align-items:center;gap:6px}
#hud .lvl{font-family:var(--fh);font-weight:700;font-size:17px;line-height:1;color:var(--gold2);white-space:nowrap;max-width:42vw;overflow:hidden;text-overflow:ellipsis}
.stat{display:flex;align-items:center;gap:5px;font-weight:800;font-size:15px;white-space:nowrap}
.stat small{font-weight:600;opacity:.75;font-size:12px}
.bar{width:70px;height:9px;border-radius:9px;background:rgba(255,255,255,.15);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#F2B33D,#FFE28A);width:100%;transition:width .25s}
.ico{width:20px;height:20px;display:inline-block}
.hbtn{background:rgba(255,255,255,.1);color:var(--cream);border:1px solid var(--line);border-radius:10px;padding:7px 11px;font-weight:800;font-size:14px;white-space:nowrap}
.hbtn:hover{background:rgba(255,255,255,.18)}
.hbtn.go{background:linear-gradient(180deg,#F7C14E,#E39A24);color:#3A2410;border-color:#FFD98A;box-shadow:0 2px 0 #9C5F12}
.hbtn.go.pulse{animation:pulse 1.4s infinite}
.hbtn:disabled{opacity:.45;cursor:default}
.hbtn.on{background:rgba(242,179,61,.28);border-color:var(--gold)}
@keyframes pulse{0%,100%{box-shadow:0 2px 0 #9C5F12,0 0 0 0 rgba(255,212,110,.7)}50%{box-shadow:0 2px 0 #9C5F12,0 0 0 8px rgba(255,212,110,0)}}
.spacer{flex:1}
/* ---------- stage ---------- */
#stage{position:relative;flex:1;min-height:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#popup{position:absolute;display:none;z-index:6;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px;gap:6px;flex-wrap:wrap;max-width:300px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
#popup.show{display:flex}
.pop-t{width:100%;font-family:var(--fh);font-weight:700;font-size:14px;color:var(--gold2);padding:0 4px}
.tbtn{display:flex;flex-direction:column;align-items:center;gap:2px;background:rgba(255,255,255,.08);border:1px solid var(--line);color:var(--cream);border-radius:12px;padding:6px 6px 5px;min-width:64px;font-size:12px;font-weight:700}
.tbtn canvas{width:38px;height:38px}
.tbtn .c{font-weight:800;color:var(--gold2);font-size:12px}
.tbtn.sel{border-color:var(--gold);background:rgba(242,179,61,.22)}
.tbtn:disabled{opacity:.42}
.tbtn.locked{opacity:.3}
#toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:7;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:6px;width:min(92%,560px)}
.tmsg{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-weight:700;font-size:14px;text-align:center;animation:tin .25s ease-out}
.tmsg.verse{font-weight:600;font-style:italic;color:#FFF0CF}
.tmsg.verse b{display:block;font-style:normal;font-size:12px;color:var(--gold2);margin-top:3px}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
#coach{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:6;background:rgba(46,33,64,.88);border:1px solid var(--gold);border-radius:12px;padding:8px 14px;font-weight:700;font-size:14px;max-width:min(92%,520px);text-align:center;display:none;pointer-events:none}
#coach.show{display:block;animation:tin .3s}
/* ---------- palette ---------- */
#bottom{background:var(--panel);border-top:1px solid var(--line);z-index:5}
#palette{display:flex;gap:6px;padding:6px 8px;overflow-x:auto;scrollbar-width:none;align-items:stretch}
#palette::-webkit-scrollbar{display:none}
#palette .tbtn{flex:0 0 auto}
#palette .key{font-size:10px;opacity:.6;font-weight:700}
#sel{display:none;align-items:center;gap:8px;padding:6px 10px;border-top:1px solid var(--line);flex-wrap:wrap}
#sel.show{display:flex}
#sel .nm{font-family:var(--fh);font-weight:700;font-size:16px;color:var(--gold2)}
#sel .st{font-size:12px;opacity:.85;flex:1;min-width:140px}
/* ---------- screens ---------- */
.screen{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(30,20,40,.72);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.screen.show{display:flex}
.card{background:linear-gradient(180deg,#FFF7E8,#F3E2BF);color:var(--ink);border-radius:20px;padding:22px 22px 18px;max-width:640px;width:100%;max-height:100%;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.45);border:2px solid #E2C48C;user-select:text;-webkit-user-select:text}
.card h1,.card h2,.card h3{font-family:var(--fh);line-height:1.1;color:var(--terra2)}
.card h1{font-size:30px;margin-bottom:6px}
.card h2{font-size:24px;margin-bottom:8px}
.card h3{font-size:18px;margin:14px 0 6px}
.card p{line-height:1.55;margin-bottom:10px;font-size:15.5px}
.card .sub{font-family:var(--fh);font-weight:600;color:var(--ink2);font-size:15px;margin-bottom:10px}
.verse{background:rgba(192,97,63,.08);border-left:4px solid var(--terra);border-radius:8px;padding:10px 12px;margin:10px 0;font-style:italic;line-height:1.55;font-size:15px}
.verse b{display:block;font-style:normal;font-size:13px;color:var(--terra2);margin-top:4px;font-weight:800}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.btn{background:var(--dusk);color:var(--cream);border-radius:12px;padding:11px 18px;font-weight:800;font-size:15px;border:2px solid transparent}
.btn:hover{background:var(--dusk2)}
.btn.pri{background:linear-gradient(180deg,#F7C14E,#E39A24);color:#3A2410;border-color:#FFD98A}
.btn.ghost{background:transparent;color:var(--ink);border-color:#D9BD88}
.btn:disabled{opacity:.45}
.btn.full{flex:1 1 200px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin:8px 0}
.kv b{color:var(--terra2)}
.stars{color:#E39A24;letter-spacing:2px;font-size:20px}
.stars .off{color:#D8C5A0}
/* title */
#title{background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;padding:0}
#titleCv{position:absolute;inset:0;width:100%;height:100%}
#titleBox{position:relative;text-align:center;padding:18px;max-width:520px;width:100%}
#titleBox h1{font-family:var(--fh);font-weight:800;font-size:clamp(38px,9vw,64px);line-height:.95;color:#FFE7A8;text-shadow:0 3px 0 #9E4A2F,0 8px 30px rgba(0,0,0,.45);letter-spacing:-.01em}
#titleBox .tag{font-weight:700;color:#FFE9C7;margin:12px 0 18px;font-size:16px;text-shadow:0 2px 8px rgba(0,0,0,.5)}
#titleBox .menu{display:flex;flex-direction:column;gap:8px;align-items:stretch;max-width:320px;margin:0 auto}
#titleBox .btn{font-size:16px;padding:12px 18px;background:rgba(46,33,64,.85);border-color:rgba(255,231,190,.35)}
#titleBox .btn.pri{background:linear-gradient(180deg,#F7C14E,#E39A24);color:#3A2410}
#titleBox .foot{margin-top:14px;font-size:12px;opacity:.85}
#titleBox .foot a{color:#FFE7A8}
/* map screen */
#mapScr .card{max-width:980px;padding:14px}
#mapWrap{position:relative;width:100%}
#mapCv{width:100%;display:block;border-radius:14px;background:#E8CB97;touch-action:manipulation}
.mapbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.mapbar h2{margin:0;flex:1;min-width:180px}
.pill{background:var(--dusk);color:#FFE7A8;border-radius:999px;padding:5px 12px;font-weight:800;font-size:13px}
/* lists */
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.55);border:1px solid #E2C48C;border-radius:14px;padding:10px 12px}
.item .t{flex:1}
.item .t b{font-family:var(--fh);font-size:16px;color:var(--terra2);display:block}
.item .t span{font-size:13.5px;color:var(--ink2);line-height:1.4;display:block}
.item canvas{width:44px;height:44px;flex:0 0 auto}
.pips{font-size:13px;color:#E39A24;font-weight:800;white-space:nowrap}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tabs button{background:rgba(255,255,255,.5);border:1px solid #D9BD88;border-radius:999px;padding:6px 12px;font-weight:800;color:var(--ink2)}
.tabs button.on{background:var(--dusk);color:#FFE7A8;border-color:var(--dusk)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:14px;margin:6px 0 10px}
.keys kbd{background:var(--dusk);color:#FFE7A8;border-radius:6px;padding:2px 7px;font-family:var(--fb);font-weight:800;font-size:12px;white-space:nowrap;justify-self:start}
.small{font-size:12.5px;color:var(--ink2);line-height:1.5}
.locked-v{opacity:.55}
@media (max-width:620px){
  #hud{padding:5px 8px;gap:5px 8px}
  #hud .lvl{font-size:15px;max-width:38vw}
  .bar{width:46px}
  .hbtn{padding:6px 9px;font-size:13px}
  .card{padding:16px 15px 14px;border-radius:16px}
  .card h1{font-size:25px}
  .card p{font-size:14.5px}
  .tbtn{min-width:58px;font-size:11px}
  .tbtn canvas{width:32px;height:32px}
}
@media (prefers-reduced-motion:reduce){.hbtn.go.pulse{animation:none}}
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="grp"><button class="hbtn" id="bMenu" title="Pause and menu (Escape)">&#9776;</button><span class="lvl" id="hLvl">Sheep Gate</span></div>
    <div class="stat" title="Resolve: if it runs out, the work pauses"><canvas class="ico" id="icoRes" width="40" height="40"></canvas><span id="hRes">20</span><div class="bar"><i id="hResBar"></i></div></div>
    <div class="stat" title="Stones: spend them to build, upgrade and repair"><canvas class="ico" id="icoSt" width="40" height="40"></canvas><span id="hSt">120</span></div>
    <div class="stat" title="Wave"><small>Wave</small><span id="hWave">0/8</span></div>
    <div class="spacer"></div>
    <div class="grp">
      <button class="hbtn" id="bRepair" title="Repair a section of the wall (R)">Repair wall</button>
      <button class="hbtn" id="bSpeed" title="Game speed (F)">1&times;</button>
      <button class="hbtn" id="bHelp" title="Controls and help (H)">?</button>
      <button class="hbtn go pulse" id="bWave" title="Start the next wave (Space)">Start wave</button>
    </div>
  </header>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="popup"></div>
    <div id="toast"></div>
    <div id="coach"></div>
  </div>
  <div id="bottom">
    <div id="sel"></div>
    <nav id="palette"></nav>
  </div>
</div>

<div class="screen show" id="title">
  <canvas id="titleCv"></canvas>
  <div id="titleBox">
    <h1>Watchmen<br/>on the Walls</h1>
    <div class="tag">Rebuild Jerusalem gate by gate. Keep watch day and night.</div>
    <div class="menu" id="titleMenu"></div>
    <div class="foot">A game by <a href="/">linkbridges.org</a> &middot; Scripture from the English Standard Version</div>
  </div>
</div>
<div class="screen" id="mapScr"><div class="card">
  <div class="mapbar"><h2>The Walls of Jerusalem</h2><span class="pill" id="mapHope">Hope 0</span><button class="btn ghost" id="mapBack">Back</button></div>
  <div id="mapWrap"><canvas id="mapCv"></canvas></div>
  <div class="row" id="mapBtns"></div>
</div></div>
<div class="screen" id="briefScr"><div class="card" id="briefCard"></div></div>
<div class="screen" id="storyScr"><div class="card" id="storyCard"></div></div>
<div class="screen" id="resultScr"><div class="card" id="resultCard"></div></div>
<div class="screen" id="pauseScr"><div class="card" id="pauseCard"></div></div>
<div class="screen" id="helpScr"><div class="card" id="helpCard"></div></div>
<div class="screen" id="shopScr"><div class="card" id="shopCard"></div></div>
<div class="screen" id="bookScr"><div class="card" id="bookCard"></div></div>
<div class="screen" id="aboutScr"><div class="card" id="aboutCard"></div></div>

// ============================================================
function RNG(seed){let a=seed>>>0;return function(){a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};}
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const dist2=(ax,ay,bx,by)=>{const dx=ax-bx,dy=ay-by;return dx*dx+dy*dy;};

function levelCfg(idx){return idx<0?ENDLESS:LEVELS[idx];}

function buildGeom(cfg,seed){
  const blocked=[];for(let c=0;c<COLS;c++){blocked.push(new Array(ROWS).fill(0));}
  for(let r=0;r<ROWS;r++){blocked[15][r]=2;blocked[16][r]=2;}
  const paths=cfg.paths.map(wp=>{
    const pts=wp.map(p=>({x:p[0]+.5,y:p[1]+.5}));
    // mark tiles along segments
    for(let i=0;i<wp.length-1;i++){
      const [x0,y0]=wp[i],[x1,y1]=wp[i+1];
      const n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0));
      for(let k=0;k<=n;k++){const x=Math.round(x0+(x1-x0)*k/n),y=Math.round(y0+(y1-y0)*k/n);
        if(x>=0&&x<BUILD_COLS&&y>=0&&y<ROWS)blocked[x][y]=1;}
    }
    // end at the gate inside the wall
    const last=pts[pts.length-1];pts[pts.length-1]={x:15.5,y:last.y};
    const cum=[0];for(let i=1;i<pts.length;i++)cum.push(cum[i-1]+Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y));
    return {pts,cum,len:cum[cum.length-1]};
  });
  // decorations on free tiles
  const rng=RNG(seed);const decor=[];
  const want=9+Math.floor(rng()*4);let tries=0;
  while(decor.length<want&&tries<400){tries++;
    const c=Math.floor(rng()*BUILD_COLS),r=Math.floor(rng()*ROWS);
    if(blocked[c][r])continue;
    // keep tiles next to the path free for building
    let near=false;for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++){const cc=c+dx,rr=r+dy;if(cc>=0&&cc<BUILD_COLS&&rr>=0&&rr<ROWS&&blocked[cc][rr]===1)near=true;}
    if(near&&rng()<.85)continue;
    blocked[c][r]=3;decor.push({c,r,k:Math.floor(rng()*1000)});
  }
  // free sand specks for texture (not blocking)
  const specks=[];for(let i=0;i<220;i++)specks.push({x:rng()*15,y:rng()*10,s:.02+rng()*.05,a:rng()});
  return {blocked,paths,decor,specks};
}
function posAt(path,d){
  const {pts,cum}=path;if(d<=0)return{x:pts[0].x,y:pts[0].y,a:Math.atan2(pts[1].y-pts[0].y,pts[1].x-pts[0].x)};
  let i=1;while(i<cum.length-1&&cum[i]<d)i++;
  const seg=cum[i]-cum[i-1]||1,f=clamp((d-cum[i-1])/seg,0,1);
  return{x:pts[i-1].x+(pts[i].x-pts[i-1].x)*f,y:pts[i-1].y+(pts[i].y-pts[i-1].y)*f,a:Math.atan2(pts[i].y-pts[i-1].y,pts[i].x-pts[i-1].x)};
}

function makeWave(idx,w,cfg){
  const endless=idx<0;
  const rng=RNG((idx+3)*7919+w*104729+13);
  const pool=cfg.pool.filter(p=>p[1]<=w).map(p=>p[0]);
  const lv=endless?5+w*.24:idx;
  let budget=(5+w*3.0)*(1+lv*.1)*(w<2?.75:1)*(cfg.paths.length>1?.9:1);
  let hpMul=(1+w*.07)*(1+lv*.075);
  if(endless)hpMul*=1+Math.max(0,w-15)*.035;
  let boss=null;
  if(!endless&&cfg.boss&&w===cfg.waves-1)boss=cfg.boss;
  if(endless&&w%10===9)boss=['mockB','burdenB','voicesB','whirlB'][Math.floor(w/10)%4];
  if(boss)budget*=.55;
  const groups=[];const newest=pool[pool.length-1];
  // a shadow met for the first time this wave comes as one small group among familiar ones
  const fresh=endless?[]:cfg.pool.filter(p=>p[1]===w&&w>0).map(p=>p[0]);
  const known=pool.filter(t=>!fresh.includes(t));
  fresh.forEach(t=>{const n=3;groups.push({type:t,n});budget-=n*ENEMIES[t].cost;});
  while(budget>.4&&groups.length<14){
    const src=known.length?known:pool;
    const type=(!fresh.length&&rng()<.3)?newest:src[Math.floor(rng()*src.length)];
    const def=ENEMIES[type];let n=3+Math.floor(rng()*4);
    n=Math.max(1,Math.min(n,Math.ceil(budget/def.cost)));
    groups.push({type,n});budget-=n*def.cost;
  }
  if(boss)groups.splice(Math.min(2,groups.length),0,{type:boss,n:1});
  const sched=[];let t=.5;const np=cfg.paths.length;
  groups.forEach((g,i)=>{const def=ENEMIES[g.type];const sp=clamp(.9/def.speed,.45,1.5);
    const path=def.boss?(np>1?Math.floor(rng()*np):0):i%np;
    for(let k=0;k<g.n;k++){sched.push({t,type:g.type,path});t+=sp;}
    t+=def.boss?2:1.1;});
  return {sched,hpMul,boss,dur:t};
}

function towerStats(G,t){
  const def=TOWERS[t.type];const s={};
  for(let i=0;i<=t.tier;i++)Object.assign(s,def.tiers[i]);
  if(t.master)Object.assign(s,def.master);
  delete s.up;delete s.title;delete s.desc;
  const m=G.mods;
  if(s.range)s.range*=1+.08*m.range;
  const pm=(1+.1*m.power)*(1+(t.dmgBoost||0));
  if(s.dmg)s.dmg*=pm;if(s.dps)s.dps*=pm;
  if(s.rate)s.rate*=1+(t.boost||0);
  if(s.dps)s.dps*=1+(t.boost||0);
  return s;
}
function towerCost(G,type){return Math.round(TOWERS[type].cost*(1-.08*G.mods.cheap));}
function upgradeCost(G,t){
  const def=TOWERS[t.type];
  if(t.master)return null;
  if(t.tier<2)return def.tiers[t.tier+1].up;
  if(G.mods.masters[t.type])return def.master.up;
  return null;
}
function towerAllowed(G,type){
  const def=TOWERS[type];
  if(G.idx>=0&&def.unlock>G.idx&&G.mode!=='vigil')return false;
  if(G.mode==='vigil'&&def.unlock>G.idx)return false;
  if(G.vigil==='watch'&&type!=='watch'&&type!=='trumpet')return false;
  return true;
}

function newGame(idx,mode,mods,save){
  const cfg=levelCfg(idx);
  const G={idx,mode:mode||'story',cfg,mods,vigil:mode==='vigil'?LEVEL_VIGIL[idx]:null,
    geom:buildGeom(cfg,(idx+5)*1337),t:0,
    stones:0,resolve:0,maxResolve:0,wave:0,waves:cfg.waves,waveActive:false,sched:null,waveT:0,schedI:0,
    enemies:[],towers:[],shots:[],fx:[],events:[],sections:0,retries:0,leaks:0,over:false,won:false,
    nextId:1,autoT:-1,kills:0,seen:{},paused:false,midShown:false,endlessHope:0};
  G.stones=130+(idx>=0?idx*35:200)+40*(cfg.paths.length-1)+30*mods.stones;
  G.maxResolve=20+5*mods.resolve;G.resolve=G.maxResolve;
  if(G.vigil==='lean')G.stones=Math.round(G.stones*.5);
  if(G.vigil==='norest')G.autoT=12;
  return G;
}
function emit(G,type,data){G.events.push(Object.assign({type},data||{}));}

function canBuild(G,c,r){return c>=0&&c<BUILD_COLS&&r>=0&&r<ROWS&&!G.geom.blocked[c][r]&&!G.towers.some(t=>t.c===c&&t.r===r);}
function build(G,type,c,r){
  if(!towerAllowed(G,type))return 'That helper is not available here.';
  if(!canBuild(G,c,r))return 'You cannot build there.';
  if(G.vigil==='few'&&G.towers.length>=6)return 'Few Hands: no more than 6 helpers.';
  const cost=towerCost(G,type);if(G.stones<cost)return 'Not enough stones.';
  G.stones-=cost;
  const t={id:G.nextId++,type,c,r,x:c+.5,y:r+.5,tier:0,master:false,cd:.2,mode:'first',ang:-Math.PI/2,flash:0,spent:cost,fresh:true,kills:0,boost:0,dmgBoost:0,born:G.t};
  G.towers.push(t);emit(G,'build',{t});return t;
}
function upgrade(G,t){
  const cost=upgradeCost(G,t);if(cost==null)return 'Already at the highest rank.';
  if(G.stones<cost)return 'Not enough stones.';
  G.stones-=cost;t.spent+=cost;if(t.tier<2)t.tier++;else t.master=true;
  emit(G,'upgrade',{t});return t;
}
function sellValue(t){return t.fresh?t.spent:Math.floor(t.spent*.7);}
function sell(G,t){const v=sellValue(t);G.stones+=v;G.towers=G.towers.filter(x=>x!==t);emit(G,'sell',{t,v});return v;}
function repairCost(G){return G.sections>=4?null:REPAIR_COSTS[G.sections];}
function repair(G){
  const c=repairCost(G);if(c==null)return 'The wall here is whole.';
  if(G.stones<c)return 'Not enough stones.';
  G.stones-=c;G.sections++;G.maxResolve+=4;G.resolve+=4;emit(G,'repair',{n:G.sections});
  if(G.sections===4)emit(G,'doors',{});
  return true;
}
function snapshot(G){
  return {stones:G.stones,resolve:G.resolve,maxResolve:G.maxResolve,wave:G.wave,sections:G.sections,retries:G.retries,leaks:G.leaks,
    towers:G.towers.map(t=>({type:t.type,c:t.c,r:t.r,tier:t.tier,master:t.master,mode:t.mode,spent:t.spent,kills:t.kills}))};
}
function restore(G,s){
  G.stones=s.stones;G.resolve=s.resolve;G.maxResolve=s.maxResolve;G.wave=s.wave;G.sections=s.sections;G.retries=s.retries||0;G.leaks=s.leaks||0;
  G.towers=s.towers.map(o=>({id:G.nextId++,type:o.type,c:o.c,r:o.r,x:o.c+.5,y:o.r+.5,tier:o.tier,master:o.master,cd:.2,mode:o.mode||'first',ang:-Math.PI/2,flash:0,spent:o.spent,fresh:false,kills:o.kills||0,boost:0,dmgBoost:0,born:-9}));
  G.enemies=[];G.shots=[];G.waveActive=false;G.sched=null;G.over=false;G.won=false;
  if(G.vigil==='norest')G.autoT=10;
}
function startWave(G){
  if(G.waveActive||G.over||G.wave>=G.waves)return false;
  G.snap=snapshot(G);
  const W=makeWave(G.idx,G.wave,G.cfg);
  G.sched=W.sched;G.hpMul=W.hpMul;G.schedI=0;G.waveT=0;G.waveActive=true;G.autoT=-1;
  G.towers.forEach(t=>t.fresh=false);
  emit(G,'waveStart',{n:G.wave+1,boss:W.boss});
  return true;
}
function spawn(G,type,path,d,hpMul){
  const def=ENEMIES[type];
  const bm=def.boss?(G.idx<0?G.hpMul*.6:1+(G.idx)*.04):hpMul;
  const e={id:G.nextId++,type,def,path,d:d||0,hp:def.hp*bm,maxHp:def.hp*bm,armor:def.armor||0,
    speed:def.speed*(G.vigil==='swift'?1.2:1),slowT:0,slowAmt:0,stunT:0,revealT:0,fieldSlow:0,mark:0,
    spawnT:0,wob:Math.random()*6.28,x:0,y:0,a:0,hitT:0,alive:true};
  const p=posAt(G.geom.paths[path],e.d);e.x=p.x;e.y=p.y;e.a=p.a;
  G.enemies.push(e);
  if(!G.seen[type]){G.seen[type]=1;emit(G,'newEnemy',{etype:type});}
  return e;
}
function isHidden(e,G){
  if(e.revealT>0)return false;
  if(e.def.hidden)return true;
  if(e.def.flicker)return Math.floor(G.t/3)%2===1;
  return false;
}
function damage(G,e,amt,pierce,src){
  if(!e.alive)return;
  if(!pierce)amt=Math.max(1,amt-e.armor);
  if(e.mark)amt*=1+e.mark;
  e.hp-=amt;e.hitT=.12;
  if(e.hp<=0){
    e.alive=false;G.kills++;
    const rw=e.def.reward;G.stones+=rw;
    if(src)src.kills++;
    emit(G,'kill',{e,rw});
    if(e.def.split){for(let k=0;k<2;k++){const m=spawn(G,e.def.split,e.path,Math.max(0,e.d-.25-k*.3),G.hpMul);}}
  }
}
function findTarget(G,t,range,exclude){
  let best=null,bv=-1e9;const r2=range*range;
  for(const e of G.enemies){if(!e.alive||isHidden(e,G)||(exclude&&exclude.includes(e)))continue;
    const d2=dist2(t.x,t.y,e.x,e.y);if(d2>r2)continue;
    let v;if(t.mode==='strong')v=e.hp;else if(t.mode==='close')v=-d2;else v=e.d+(e.path*0);
    if(t.mode==='first'){v=e.d/(G.geom.paths[e.path].len);}
    if(v>bv){bv=v;best=e;}}
  return best;
}
function update(G,dt){
  if(G.over)return;
  G.t+=dt;
  // auto start (No Rest vigil)
  if(!G.waveActive&&G.autoT>0){G.autoT-=dt;if(G.autoT<=0)startWave(G);}
  // spawning
  if(G.waveActive&&G.sched){
    G.waveT+=dt;
    while(G.schedI<G.sched.length&&G.sched[G.schedI].t<=G.waveT){const s=G.sched[G.schedI++];spawn(G,s.type,s.path,0,G.hpMul);}
  }
  // helpers that help other helpers
  for(const t of G.towers){t.boost=0;t.dmgBoost=0;}
  for(const c of G.towers){if(c.type!=='choir')continue;const s=towerStats(G,c);const r2=s.range*s.range;
    for(const t of G.towers){if(t===c||t.type==='choir'||t.type==='mason')continue;
      if(dist2(c.x,c.y,t.x,t.y)<=r2){t.boost=Math.max(t.boost,s.boost);t.dmgBoost=Math.max(t.dmgBoost,s.dmgBoost||0);}}}
  // gatekeeper fields
  for(const e of G.enemies){e.fieldSlow=0;e.mark=0;}
  for(const k of G.towers){if(k.type!=='keeper')continue;const s=towerStats(G,k);const r2=s.range*s.range;let any=false;
    for(const e of G.enemies){if(!e.alive)continue;if(dist2(k.x,k.y,e.x,e.y)<=r2){any=true;e.fieldSlow=Math.max(e.fieldSlow,s.slow);if(s.mark)e.mark=Math.max(e.mark,s.mark);damage(G,e,s.dps*dt,true,k);}}
    k.active=any;}
  // watchmen see what comes close; gatekeepers see everything inside their circle
  for(const t of G.towers){if(t.type!=='watch'&&t.type!=='keeper')continue;const rr=t.type==='watch'?1.3:towerStats(G,t).range;const r2=rr*rr;
    for(const e of G.enemies)if(e.alive&&(e.def.hidden||e.def.flicker)&&dist2(t.x,t.y,e.x,e.y)<=r2)e.revealT=Math.max(e.revealT,.15);}
  // move shadows
  for(const e of G.enemies){
    if(!e.alive)continue;
    e.slowT-=dt;e.stunT-=dt;e.revealT-=dt;e.hitT-=dt;e.wob+=dt*4;
    let sp=e.speed;const sl=Math.max(e.slowT>0?e.slowAmt:0,e.fieldSlow);sp*=1-sl;if(e.stunT>0)sp=0;
    e.d+=sp*dt;
    const path=G.geom.paths[e.path];
    const p=posAt(path,e.d);e.x=p.x;e.y=p.y;e.a=p.a;
    if(e.def.spawn){e.spawnT+=dt;if(e.spawnT>=e.def.spawn.every){e.spawnT=0;const ty=e.def.spawn.types[Math.floor(Math.random()*e.def.spawn.types.length)];spawn(G,ty,e.path,Math.max(0,e.d-.4),G.hpMul*.8);}}
    if(e.d>=path.len){e.alive=false;G.resolve-=e.def.harm;G.leaks++;emit(G,'leak',{e});
      if(G.resolve<=0){G.resolve=0;G.over=true;emit(G,'defeat',{});return;}}
  }
  // helpers act
  for(const t of G.towers){
    t.flash-=dt;const def=TOWERS[t.type];if(def.kind==='econ'||def.kind==='aura'||def.kind==='field')continue;
    const s=towerStats(G,t);t.cd-=dt;
    if(def.kind==='bolt'){
      const tg=findTarget(G,t,s.range);if(tg)t.ang=Math.atan2(tg.y-t.y,tg.x-t.x);
      if(t.cd<=0&&tg){t.cd=1/s.rate;t.flash=.12;
        const n=s.multi||1;const ex=[];
        for(let i=0;i<n;i++){const g=i===0?tg:findTarget(G,t,s.range,ex);if(!g)break;ex.push(g);
          G.shots.push({x:t.x,y:t.y-.15,tg:g,tx:g.x,ty:g.y,dmg:s.dmg,src:t,sp:9,col:'#FFE08A'});}
        emit(G,'shoot',{t});}
    }else if(def.kind==='pulse'){
      if(t.cd<=0){const r2=s.range*s.range;const hit=G.enemies.filter(e=>e.alive&&dist2(t.x,t.y,e.x,e.y)<=r2);
        if(hit.length){t.cd=1/s.rate;t.flash=.25;
          for(const e of hit){e.revealT=2.5;e.slowT=s.slowDur;e.slowAmt=Math.max(e.slowT>0?e.slowAmt:0,s.slow);if(s.stun)e.stunT=s.stun;damage(G,e,s.dmg,true,t);}
          G.fx.push({k:'ring',x:t.x,y:t.y,r:s.range,t:0,life:.5,col:'#FFB36B'});emit(G,'pulse',{t});}}
    }else if(def.kind==='beam'){
      // reveal rumors in range
      const r2=s.range*s.range;for(const e of G.enemies)if(e.alive&&dist2(t.x,t.y,e.x,e.y)<=r2&&(e.def.hidden||e.def.flicker))e.revealT=Math.max(e.revealT,.2);
      const tg=findTarget(G,t,s.range);if(tg)t.ang=Math.atan2(tg.y-t.y,tg.x-t.x);
      if(t.cd<=0&&tg){t.cd=1/s.rate;t.flash=.2;
        let ex=tg.x,ey=tg.y;
        if(s.pierce){const L=Math.hypot(tg.x-t.x,tg.y-t.y)||1;ex=t.x+(tg.x-t.x)/L*s.range;ey=t.y+(tg.y-t.y)/L*s.range;
          for(const e of G.enemies){if(!e.alive)continue;if(segDist(t.x,t.y,ex,ey,e.x,e.y)<.4)damage(G,e,s.dmg,true,t);}}
        else damage(G,tg,s.dmg,true,t);
        G.fx.push({k:'beam',x:t.x,y:t.y,x2:ex,y2:ey,t:0,life:.25});emit(G,'beam',{t});}
    }
  }
  // light bolts
  for(const sh of G.shots){
    if(sh.tg.alive){sh.tx=sh.tg.x;sh.ty=sh.tg.y;}
    const dx=sh.tx-sh.x,dy=sh.ty-sh.y,L=Math.hypot(dx,dy);const step=sh.sp*dt;
    if(L<=step+.12){sh.done=true;if(sh.tg.alive)damage(G,sh.tg,sh.dmg,false,sh.src);G.fx.push({k:'spark',x:sh.tx,y:sh.ty,t:0,life:.3});}
    else{sh.x+=dx/L*step;sh.y+=dy/L*step;}
  }
  G.shots=G.shots.filter(s=>!s.done);
  G.enemies=G.enemies.filter(e=>e.alive);
  for(const f of G.fx)f.t+=dt;G.fx=G.fx.filter(f=>f.t<f.life);
  // halfway word of encouragement
  if(!G.midShown&&G.idx>=0&&G.wave>=Math.floor(G.waves/2)){G.midShown=true;emit(G,'midVerse',{});}
  // wave cleared
  if(G.waveActive&&G.schedI>=G.sched.length&&G.enemies.length===0){
    G.waveActive=false;G.wave++;
    let bonus=20+G.wave*3;bonus=Math.round(bonus*(1+.1*G.sections));if(G.vigil==='lean')bonus=Math.round(bonus*.5);
    let income=0,heal=0;for(const t of G.towers){if(t.type==='mason'){const s=towerStats(G,t);income+=s.income;if(s.heal)heal+=s.heal;}}
    G.stones+=bonus+income;if(heal)G.resolve=Math.min(G.maxResolve,G.resolve+heal);
    emit(G,'waveEnd',{n:G.wave,bonus,income,heal});
    if(G.idx<0&&G.wave%10===0&&G.wave<=100){G.endlessHope++;emit(G,'milestone',{n:G.wave});}
    if(G.wave>=G.waves){G.over=true;G.won=true;emit(G,'victory',{});}
    else if(G.vigil==='norest')G.autoT=8;
  }
}
function segDist(x1,y1,x2,y2,px,py){const dx=x2-x1,dy=y2-y1;const L2=dx*dx+dy*dy||1;let t=((px-x1)*dx+(py-y1)*dy)/L2;t=clamp(t,0,1);return Math.hypot(x1+dx*t-px,y1+dy*t-py);}
function starsFor(G){if(!G.won)return 0;let s=1;if(G.resolve>=G.maxResolve*.6)s++;if(G.sections>=4&&G.retries===0)s++;return s;}
/*LOGIC-END*/

const TAU=Math.PI*2;
const V={cw:0,ch:0,dpr:1,rot:false,s:40,ox:0,oy:0};
function layoutView(cw,ch){
  V.cw=cw;V.ch=ch;V.dpr=Math.min(2,window.devicePixelRatio||1);
  V.rot=ch>cw*1.1;
  if(V.rot){V.s=Math.min(cw/ROWS,ch/COLS);V.ox=(cw-ROWS*V.s)/2;V.oy=(ch-COLS*V.s)/2;}
  else{V.s=Math.min(cw/COLS,ch/ROWS);V.ox=(cw-COLS*V.s)/2;V.oy=(ch-ROWS*V.s)/2;}
}
function setWorld(ctx){const s=V.s*V.dpr;
  if(V.rot)ctx.setTransform(0,s,-s,0,(V.ox+ROWS*V.s)*V.dpr,V.oy*V.dpr);else ctx.setTransform(s,0,0,s,V.ox*V.dpr,V.oy*V.dpr);}
function toScreen(x,y){return V.rot?{x:V.ox+(ROWS-y)*V.s,y:V.oy+x*V.s}:{x:V.ox+x*V.s,y:V.oy+y*V.s};}
function toWorld(px,py){return V.rot?{x:(py-V.oy)/V.s,y:ROWS-(px-V.ox)/V.s}:{x:(px-V.ox)/V.s,y:(py-V.oy)/V.s};}
function upright(ctx,x,y,sc){const p=toScreen(x,y);const s=V.s*V.dpr*(sc||1);ctx.setTransform(s,0,0,s,p.x*V.dpr,p.y*V.dpr);}
function screenAng(a){return V.rot?a+Math.PI/2:a;}
function hexA(h,a){const n=parseInt(h.slice(1),16);return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`;}

// ---------- helpers (towers) ----------
function drawTowerIcon(ctx,type,r,tier,master,time,opts){
  opts=opts||{};const col=TOWERS[type].color;
  if(!opts.flat){ctx.fillStyle='rgba(40,25,30,.28)';ctx.beginPath();ctx.ellipse(r*.08,r*.18,r*.98,r*.8,0,0,TAU);ctx.fill();}
  // stone base
  const g=ctx.createRadialGradient(-r*.3,-r*.35,r*.1,0,0,r);g.addColorStop(0,'#F7E6C2');g.addColorStop(1,'#D9B57E');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,r*.92,0,TAU);ctx.fill();
  ctx.lineWidth=r*.1;ctx.strokeStyle='#A47A45';ctx.stroke();
  ctx.lineWidth=r*.13;ctx.strokeStyle=col;ctx.beginPath();ctx.arc(0,0,r*.74,0,TAU);ctx.stroke();
  ctx.save();ctx.scale(r,r);
  ctx.lineCap='round';ctx.lineJoin='round';
  if(type==='watch'){
    const fl=1+Math.sin(time*9)*.06;
    const gl=ctx.createRadialGradient(0,-.15,0,0,-.15,.7);gl.addColorStop(0,'rgba(255,226,140,.75)');gl.addColorStop(1,'rgba(255,226,140,0)');
    ctx.fillStyle=gl;ctx.beginPath();ctx.arc(0,-.15,.7,0,TAU);ctx.fill();
    ctx.fillStyle='#8B5A2B';ctx.beginPath();ctx.ellipse(0,.22,.38,.17,0,0,TAU);ctx.fill();
    ctx.fillStyle='#A86F38';ctx.beginPath();ctx.ellipse(0,.16,.3,.1,0,0,TAU);ctx.fill();
    ctx.beginPath();ctx.moveTo(.3,.16);ctx.lineTo(.48,.06);ctx.lineWidth=.08;ctx.strokeStyle='#8B5A2B';ctx.stroke();
    ctx.fillStyle='#FFB53B';ctx.beginPath();ctx.moveTo(.47,.06);ctx.quadraticCurveTo(.62,-.1*fl,.48,-.42*fl);ctx.quadraticCurveTo(.34,-.1*fl,.47,.06);ctx.fill();
    ctx.fillStyle='#FFF4C2';ctx.beginPath();ctx.moveTo(.47,.04);ctx.quadraticCurveTo(.54,-.08,.48,-.24*fl);ctx.quadraticCurveTo(.41,-.08,.47,.04);ctx.fill();
  }else if(type==='trumpet'){
    ctx.strokeStyle='#7A4A22';ctx.lineWidth=.3;ctx.beginPath();ctx.moveTo(-.45,.25);ctx.quadraticCurveTo(-.05,.38,.25,.02);ctx.quadraticCurveTo(.38,-.16,.32,-.42);ctx.stroke();
    ctx.strokeStyle='#F0DDB4';ctx.lineWidth=.2;ctx.beginPath();ctx.moveTo(-.45,.25);ctx.quadraticCurveTo(-.05,.38,.25,.02);ctx.quadraticCurveTo(.38,-.16,.32,-.42);ctx.stroke();
    ctx.fillStyle='#F0DDB4';ctx.strokeStyle='#7A4A22';ctx.lineWidth=.06;ctx.beginPath();ctx.ellipse(.32,-.44,.16,.09,-.2,0,TAU);ctx.fill();ctx.stroke();
    ctx.fillStyle='#3B2414';ctx.beginPath();ctx.ellipse(.32,-.44,.09,.045,-.2,0,TAU);ctx.fill();
  }else if(type==='mason'){
    ctx.fillStyle='#CFC3B2';ctx.strokeStyle='#7E7468';ctx.lineWidth=.06;ctx.beginPath();ctx.rect(-.42,.02,.5,.34);ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.moveTo(-.42,.19);ctx.lineTo(.08,.19);ctx.moveTo(-.17,.02);ctx.lineTo(-.17,.19);ctx.stroke();
    const sw=Math.sin(time*6)*.15;ctx.save();ctx.translate(.12,.1);ctx.rotate(-.6+sw);
    ctx.strokeStyle='#7A4A22';ctx.lineWidth=.1;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-.52);ctx.stroke();
    ctx.fillStyle='#6E6E78';ctx.beginPath();ctx.rect(-.17,-.62,.34,.16);ctx.fill();ctx.restore();
  }else if(type==='choir'){
    ctx.strokeStyle='#C99A3A';ctx.lineWidth=.1;ctx.beginPath();ctx.moveTo(-.3,-.4);ctx.quadraticCurveTo(-.42,.15,0,.36);ctx.quadraticCurveTo(.42,.15,.3,-.4);ctx.stroke();
    ctx.beginPath();ctx.moveTo(-.34,-.36);ctx.lineTo(.34,-.36);ctx.stroke();
    ctx.strokeStyle='#5A4030';ctx.lineWidth=.035;for(let i=-2;i<=2;i++){ctx.beginPath();ctx.moveTo(i*.08,-.36);ctx.lineTo(i*.06,.22);ctx.stroke();}
    ctx.fillStyle='#2F9C95';const ny=-.1+Math.sin(time*3)*.06;ctx.beginPath();ctx.ellipse(.42,ny+.1,.08,.06,-.4,0,TAU);ctx.fill();ctx.fillRect(.47,ny-.22,.035,.32);
  }else if(type==='scribe'){
    ctx.fillStyle='#FBF1D9';ctx.strokeStyle='#8C6C3E';ctx.lineWidth=.05;ctx.beginPath();ctx.rect(-.32,-.32,.64,.6);ctx.fill();ctx.stroke();
    ctx.fillStyle='#C9A66B';ctx.beginPath();ctx.ellipse(0,-.34,.38,.08,0,0,TAU);ctx.fill();ctx.stroke();ctx.beginPath();ctx.ellipse(0,.3,.38,.08,0,0,TAU);ctx.fill();ctx.stroke();
    ctx.strokeStyle='#5B5EA6';ctx.lineWidth=.045;for(let i=0;i<4;i++){ctx.beginPath();ctx.moveTo(-.22,-.18+i*.12);ctx.lineTo(.22-(i%2)*.1,-.18+i*.12);ctx.stroke();}
  }else if(type==='keeper'){
    ctx.strokeStyle='#8A6A2A';ctx.lineWidth=.12;ctx.beginPath();ctx.arc(-.18,-.18,.17,0,TAU);ctx.stroke();
    ctx.beginPath();ctx.moveTo(-.06,-.06);ctx.lineTo(.36,.36);ctx.stroke();
    ctx.beginPath();ctx.moveTo(.22,.22);ctx.lineTo(.12,.32);ctx.moveTo(.32,.32);ctx.lineTo(.22,.42);ctx.stroke();
  }
  ctx.restore();

    if(placing&&ok){const fake={type:placing,tier:0,master:false,boost:0,dmgBoost:0};const s=towerStats(G,fake);
      if(s.range){ctx.fillStyle='rgba(255,236,180,.14)';ctx.strokeStyle='rgba(255,236,180,.7)';ctx.lineWidth=.03;ctx.beginPath();ctx.arc(ht.c+.5,ht.r+.5,s.range,0,TAU);ctx.fill();ctx.stroke();}}
  }
  if(selected){const s=towerStats(G,selected);if(s.range){ctx.fillStyle='rgba(255,236,180,.12)';ctx.strokeStyle='rgba(255,236,180,.85)';ctx.lineWidth=.035;ctx.setLineDash([.15,.1]);ctx.beginPath();ctx.arc(selected.x,selected.y,s.range,0,TAU);ctx.fill();ctx.stroke();ctx.setLineDash([]);}}
  // trumpet rings (under shadows)
  for(const f of G.fx){if(f.k==='ring'){const k=f.t/f.life;ctx.strokeStyle='rgba(255,179,107,'+(1-k)*.8+')';ctx.lineWidth=.08*(1-k)+.02;ctx.beginPath();ctx.arc(f.x,f.y,f.r*(.3+k*.7),0,TAU);ctx.stroke();}}
  // shadows
  const ens=G.enemies.slice().sort((a,b)=>a.y-b.y);

  // helpers
  const tw=G.towers.slice().sort((a,b)=>a.y-b.y);
  for(const t of tw){upright(ctx,t.x,t.y);
    const born=Math.min(1,(G.t-t.born)/.25);const sc=born<1?.6+.4*born:1;ctx.scale(sc,sc);
    if(t.flash>0&&TOWERS[t.type].kind!=='pulse'){ctx.fillStyle='rgba(255,236,170,.35)';ctx.beginPath();ctx.arc(0,0,.5,0,TAU);ctx.fill();}
    if(t===selected){ctx.strokeStyle='#FFF2C8';ctx.lineWidth=.05;ctx.beginPath();ctx.arc(0,0,.47,0,TAU);ctx.stroke();}

  }

  for(const f of G.fx){if(f.k==='beam'){const k=1-f.t/f.life;ctx.strokeStyle='rgba(190,195,255,'+k+')';ctx.lineWidth=.16*k;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(f.x,f.y);ctx.lineTo(f.x2,f.y2);ctx.stroke();
      ctx.strokeStyle='rgba(255,255,255,'+k+')';ctx.lineWidth=.05*k;ctx.beginPath();ctx.moveTo(f.x,f.y);ctx.lineTo(f.x2,f.y2);ctx.stroke();}
    else if(f.k==='spark'){const k=f.t/f.life;ctx.fillStyle='rgba(255,236,160,'+(1-k)+')';ctx.beginPath();ctx.arc(f.x,f.y,.08+k*.18,0,TAU);ctx.fill();}}
  for(const sh of G.shots){const g=ctx.createRadialGradient(sh.x,sh.y,0,sh.x,sh.y,.22);g.addColorStop(0,'rgba(255,255,240,1)');g.addColorStop(.4,'rgba(255,214,110,.9)');g.addColorStop(1,'rgba(255,214,110,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(sh.x,sh.y,.22,0,TAU);ctx.fill();}
  for(const p of R_.P){const k=p.t/p.life;ctx.globalAlpha=1-k;ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r*(1-k*.5),0,TAU);ctx.fill();}ctx.globalAlpha=1;
  // dusk and night
  drawNight(ctx,G,G.cfg.night,time);
  if(R_.leakFlash>0){ctx.fillStyle='rgba(200,60,50,'+R_.leakFlash*.25+')';ctx.fillRect(14.5,0,2.5,ROWS);}
  ctx.restore();

  for(const f of R_.F){const k=f.t/f.life;const p=toScreen(f.x,f.y);ctx.globalAlpha=1-k*k;ctx.font='800 '+Math.max(12,V.s*.34)+'px Nunito, sans-serif';
    ctx.lineWidth=3;ctx.strokeStyle='rgba(46,33,64,.7)';ctx.strokeText(f.text,p.x,p.y-k*V.s*.6);ctx.fillStyle=f.col;ctx.fillText(f.text,p.x,p.y-k*V.s*.6);}
  ctx.globalAlpha=1;
}
function stepParticles(dt){
  for(const p of R_.P){p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=1.2*dt;}R_.P=R_.P.filter(p=>p.t<p.life);

  R_.shake=Math.max(0,R_.shake-dt*3);R_.leakFlash=Math.max(0,R_.leakFlash-dt*2);
  for(let i=0;i<4;i++)R_.repairAnim[i]=Math.max(0,R_.repairAnim[i]-dt*.5);
}

// ---------- the map of Jerusalem ----------
const MAP_GATES=[[.62,.17],[.46,.12],[.30,.19],[.25,.45],[.37,.80],[.50,.85],[.58,.66],[.62,.52],[.66,.39],[.68,.27]];
const MAP_FINAL=[.47,.45],MAP_ENDLESS=[.86,.34];
function mapHit(mx,my,w,h){
  const pts=MAP_GATES.concat([MAP_FINAL,MAP_ENDLESS]);
  for(let i=0;i<pts.length;i++){const dx=pts[i][0]*w-mx,dy=pts[i][1]*h-my;if(dx*dx+dy*dy<Math.pow(Math.max(18,w*.035),2))return i===10?10:i===11?-1:i;}
  return null;
}
function drawMap(cv,save,time,hoverIdx){
  const ctx=cv.getContext('2d');const dpr=Math.min(2,window.devicePixelRatio||1);const w=cv.clientWidth,h=Math.round(w*.62);
  cv.style.height=h+'px';if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(h*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);}
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const g=ctx.createLinearGradient(0,0,w,h);g.addColorStop(0,'#F2DDB0');g.addColorStop(1,'#DDBB85');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
  // Mount of Olives and the Kidron valley
  ctx.fillStyle='rgba(111,127,58,.25)';ctx.beginPath();ctx.ellipse(w*.88,h*.36,w*.12,h*.3,0,0,TAU);ctx.fill();
  for(let i=0;i<14;i++){ctx.fillStyle='rgba(95,110,50,.45)';ctx.beginPath();ctx.arc(w*(.82+((i*37)%10)/80),h*(.15+((i*53)%40)/90),w*.012,0,TAU);ctx.fill();}
  ctx.strokeStyle='rgba(120,150,170,.45)';ctx.lineWidth=w*.008;ctx.beginPath();ctx.moveTo(w*.74,0);ctx.bezierCurveTo(w*.72,h*.4,w*.7,h*.7,w*.62,h);ctx.stroke();
  ctx.fillStyle='rgba(120,80,50,.6)';ctx.font='700 '+Math.max(10,w*.016)+'px Nunito, sans-serif';ctx.textAlign='center';
  ctx.fillText('Mount of Olives',w*.88,h*.08);ctx.fillText('Kidron Valley',w*.74,h*.94);ctx.fillText('Hinnom Valley',w*.2,h*.9);
  // city interior
  ctx.fillStyle='rgba(235,210,160,.85)';ctx.beginPath();MAP_GATES.forEach((p,i)=>{i?ctx.lineTo(p[0]*w,p[1]*h):ctx.moveTo(p[0]*w,p[1]*h);});ctx.closePath();ctx.fill();
  // little houses and the temple
  const rr=RNG(42);for(let i=0;i<60;i++){const x=.32+rr()*.32,y=.2+rr()*.6;if(!pointIn(x,y))continue;ctx.fillStyle=rr()>.5?'rgba(200,160,110,.6)':'rgba(215,180,130,.6)';ctx.fillRect(x*w,y*h,w*.012,w*.01);}
  ctx.fillStyle='#E9D3A3';ctx.strokeStyle='#B08D57';ctx.lineWidth=1.5;ctx.fillRect(w*.53,h*.23,w*.07,h*.09);ctx.strokeRect(w*.53,h*.23,w*.07,h*.09);
  ctx.fillStyle='rgba(120,80,50,.7)';ctx.fillText('Temple',w*.565,h*.36);
  // wall segments: gate i to gate i+1 rebuilt when gate i is done
  const done=i=>!!save.stars[i];
  for(let i=0;i<MAP_GATES.length;i++){const a=MAP_GATES[i],b=MAP_GATES[(i+1)%MAP_GATES.length];
    if(done(i)){ctx.strokeStyle=save.stars[10]?'#E7B54A':'#C9A26A';ctx.lineWidth=w*.012;ctx.setLineDash([]);}
    else{ctx.strokeStyle='rgba(120,90,60,.55)';ctx.lineWidth=w*.007;ctx.setLineDash([w*.012,w*.01]);}
    ctx.lineCap='round';ctx.beginPath();ctx.moveTo(a[0]*w,a[1]*h);ctx.lineTo(b[0]*w,b[1]*h);ctx.stroke();ctx.setLineDash([]);
    if(!done(i)){ctx.fillStyle='rgba(120,90,60,.5)';for(let k=1;k<4;k++){const t=k/4;ctx.fillRect((a[0]+(b[0]-a[0])*t)*w+(k%2?3:-4),(a[1]+(b[1]-a[1])*t)*h+(k%2?-4:3),3,3);}}}
  // markers
  const R=Math.max(13,w*.024);
  const marker=(p,i,label)=>{const x=p[0]*w,y=p[1]*h;const open=i===-1?!!save.stars[10]:i<=save.unlocked;const st=i>=0?(save.stars[i]||0):0;
    const pulse=open&&!st&&i>=0?1+Math.sin(time*4)*.08:1;
    ctx.fillStyle=open?(st?'#F2B33D':'#FFF2D6'):'#C9B89A';ctx.strokeStyle=hoverIdx===i?'#2E2140':'#7A4A22';ctx.lineWidth=hoverIdx===i?3:2;
    ctx.beginPath();ctx.arc(x,y,R*pulse,0,TAU);ctx.fill();ctx.stroke();
    // little arch
    ctx.fillStyle=open?'#5A3324':'#9C8A70';ctx.beginPath();ctx.moveTo(x-R*.35,y+R*.45);ctx.lineTo(x-R*.35,y-R*.05);ctx.arc(x,y-R*.05,R*.35,Math.PI,0);ctx.lineTo(x+R*.35,y+R*.45);ctx.fill();
    if(st&&i>=0&&i<10){ctx.fillStyle='#8A5A34';ctx.fillRect(x-R*.3,y-R*.1,R*.6,R*.55);}
    ctx.font='800 '+Math.max(10,w*.015)+'px Nunito, sans-serif';ctx.textAlign='center';
    ctx.lineWidth=3;ctx.strokeStyle='rgba(255,247,232,.9)';ctx.strokeText(label,x,y+R+12);ctx.fillStyle=open?'#2E2140':'#8C7A62';ctx.fillText(label,x,y+R+12);
    if(i>=0){let s='';for(let k=0;k<3;k++)s+=k<st?'★':'☆';ctx.fillStyle='#C9821A';ctx.strokeText(s,x,y+R+25);ctx.fillText(s,x,y+R+25);
      if(save.vigil[i]){ctx.fillStyle='#5B5EA6';ctx.beginPath();ctx.arc(x+R*.85,y-R*.75,R*.32,0,TAU);ctx.fill();ctx.fillStyle='#fff';ctx.font='800 '+R*.4+'px Nunito';ctx.fillText('✓',x+R*.85,y-R*.6);}}
  };
  MAP_GATES.forEach((p,i)=>marker(p,i,LEVELS[i].name.replace('The ','')));
  marker(MAP_FINAL,10,'Last Breach');
  if(save.stars[10])marker(MAP_ENDLESS,-1,'Night Watch');
}
function pointIn(x,y){let ins=false;const P=MAP_GATES;for(let i=0,j=P.length-1;i<P.length;j=i++){const xi=P[i][0],yi=P[i][1],xj=P[j][0],yj=P[j][1];if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))ins=!ins;}return ins;}

const AU={ctx:null,master:null,last:{}};
function audioInit(){if(AU.ctx){if(AU.ctx.state==='suspended')AU.ctx.resume();return;}
  try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;AU.ctx=new C();AU.master=AU.ctx.createGain();AU.master.gain.value=.55;AU.master.connect(AU.ctx.destination);}catch(e){AU.ctx=null;}}
function tone(freq,dur,type,vol,slideTo,delay){
  if(!save.sound||!AU.ctx)return;try{const t0=AU.ctx.currentTime+(delay||0);const o=AU.ctx.createOscillator(),g=AU.ctx.createGain();o.type=type||'sine';
  o.frequency.setValueAtTime(freq,t0);if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t0+dur);
  g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol||.1,t0+.012);g.gain.exponentialRampToValueAtTime(.0005,t0+dur);
  o.connect(g);g.connect(AU.master);o.start(t0);o.stop(t0+dur+.03);}catch(e){}}

  switch(name){
    case 'shoot':tone(1250+Math.random()*200,.07,'sine',.035,1700);break;
    case 'pulse':tone(147,.55,'sawtooth',.05,185);tone(220,.55,'triangle',.05,277,.04);break;
    case 'beam':tone(660,.2,'triangle',.05,990);break;
    case 'kill':tone(880+Math.random()*80,.12,'sine',.05);tone(1320,.18,'sine',.035,null,.05);break;
    case 'leak':tone(110,.32,'square',.06,70);break;
    case 'build':tone(220,.08,'triangle',.1);tone(330,.1,'triangle',.07,null,.06);break;
    case 'up':[523,659,784].forEach((f,i)=>tone(f,.16,'triangle',.07,null,i*.06));break;
    case 'repair':for(let i=0;i<3;i++)tone(170+i*25,.07,'square',.045,null,i*.11);break;
    case 'wave':tone(196,.75,'sawtooth',.05,247);tone(294,.75,'triangle',.045,370,.06);break;
    case 'clear':[392,494,587,784].forEach((f,i)=>tone(f,.26,'triangle',.06,null,i*.08));break;
    case 'win':[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,.32,'triangle',.07,null,i*.13));break;
    case 'click':tone(720,.04,'sine',.04);break;
    case 'no':tone(160,.12,'square',.04);break;
    case 'doors':[262,330,392,523].forEach((f,i)=>tone(f,.5,'triangle',.06,null,i*.1));break;
  }}

// ---------- map ----------
function openMap(){
  A.G=null;hideSel();coach(null);showScreen('mapScr');
  $('mapHope').textContent='Hope '+hopeLeft()+' to spend · '+totalHope()+' earned';
  const b=$('mapBtns');b.innerHTML='';
  const add=(label,fn,cls)=>{const x=document.createElement('button');x.className='btn '+(cls||'');x.textContent=label;x.onclick=()=>{sfx('click');fn();};b.appendChild(x);return x;};
  const next=Math.min(save.unlocked,10);
  add((save.stars[next]?'Play ':'Next: ')+LEVELS[next].name,()=>openBrief(next),'pri');
  for(let i=0;i<=next;i++)if(i!==next)add(LEVELS[i].name.replace('The ','')+' '+'★'.repeat(save.stars[i]||0),()=>openBrief(i),'ghost');
  if(save.stars[10])add('Night Watch (best wave '+(save.endlessBest||0)+')',()=>openBrief(-1),'ghost');
  add('Workshop',()=>openShop('map'));add('Book of Remembrance',()=>openBook('map','verses'));
  $('mapBack').onclick=()=>{sfx('click');openTitle();};
}
function mapCoords(ev){const cv=$('mapCv');const r=cv.getBoundingClientRect();return{x:ev.clientX-r.left,y:ev.clientY-r.top,w:r.width,h:r.height};}
