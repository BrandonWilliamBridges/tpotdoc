const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const homeLink=document.getElementById('home');
const VH=360,T=24,TAU=Math.PI*2;
let VW=640,SC=1,OX=0,OY=0,CW=0,CH=0,DPR=1,portrait=false,safe={t:0,r:0,b:0,l:0};
let darkCv=document.createElement('canvas'),dctx=darkCv.getContext('2d');
let bgCache=null;
const rnd=(a,b)=>b===undefined?Math.random()*(a===undefined?1:a):a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
function seeded(s){return function(){s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
const FONT='Georgia,"Iowan Old Style","Palatino Linotype",Palatino,"Times New Roman",serif';
function font(px,style){ctx.font=(style?style+' ':'')+px+'px '+FONT;}
function wrap(text,maxW){const words=String(text).split(' ');const lines=[];let cur='';for(const w of words){const t=cur?cur+' '+w:w;if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=w;}else cur=t;}if(cur)lines.push(cur);return lines;}
function textBlock(text,x,y,maxW,lh,align){ctx.textAlign=align||'center';const ls=wrap(text,maxW);for(let i=0;i<ls.length;i++)ctx.fillText(ls[i],x,y+i*lh);return ls.length*lh;}
function rrect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath();}
function glow(c,x,y,r,col,a){const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col);g.addColorStop(1,'rgba(0,0,0,0)');c.globalAlpha=a===undefined?1:a;c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,TAU);c.fill();c.globalAlpha=1;}

function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  CW=window.innerWidth;CH=window.innerHeight;
  cv.width=Math.max(1,Math.round(CW*DPR));cv.height=Math.max(1,Math.round(CH*DPR));
  try{const cs=getComputedStyle(document.getElementById('safe'));safe={t:parseFloat(cs.paddingTop)||0,r:parseFloat(cs.paddingRight)||0,b:parseFloat(cs.paddingBottom)||0,l:parseFloat(cs.paddingLeft)||0};}catch(e){}
  portrait=CH>CW*1.05;
  VW=Math.max(480,Math.min(900,Math.round(VH*CW/CH)));
  SC=Math.min(CW/VW,CH/VH);
  OX=(CW-VW*SC)/2;
  OY=portrait?Math.max(safe.t+48,(CH-VH*SC)*0.2):(CH-VH*SC)/2;
  darkCv.width=Math.ceil(VW/2);darkCv.height=VH/2;
  bgCache=null;
}

// ---------------- Save ----------------
const SAVE_KEY='lampUntoMyFeet.save.v1';
let save={unlocked:0,virtues:[false,false,false,false],scrolls:{},lost:{},best:{},glad:{},journal:{},rooms:{},mute:false,finished:false,started:false,retUnlocked:0,retDone:false};
function loadSave(){try{const s=localStorage.getItem(SAVE_KEY);if(s){const o=JSON.parse(s);if(o&&typeof o==='object'){Object.assign(save,o);if(!Array.isArray(save.virtues)||save.virtues.length!==4)save.virtues=[false,false,false,false];if(!save.scrolls)save.scrolls={};if(!save.lost)save.lost={};if(!save.best)save.best={};for(const k of ['glad','journal','rooms'])if(!save[k]||typeof save[k]!=='object')save[k]={};}}}catch(e){}}
function writeSave(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}}

// ---------------- Audio ----------------
let AC=null,master=null,musG=null,sfxG=null,noiseBuf=null,hum=null;
const music={id:null,step:0,next:0,swell:0};
function initAudio(){
  if(AC){if(AC.state==='suspended'){try{AC.resume();}catch(e){}}return;}
  try{
    const A=window.AudioContext||window.webkitAudioContext;if(!A)return;
    AC=new A();master=AC.createGain();master.gain.value=save.mute?0:0.9;master.connect(AC.destination);
    musG=AC.createGain();musG.gain.value=0.5;musG.connect(master);
    sfxG=AC.createGain();sfxG.gain.value=0.6;sfxG.connect(master);
    noiseBuf=AC.createBuffer(1,(AC.sampleRate*0.6)|0,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    const o=AC.createOscillator(),o2=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=196;o2.type='sine';o2.frequency.value=294.4;g.gain.value=0;o.connect(g);o2.connect(g);g.connect(sfxG);o.start();o2.start();hum={g:g};
    music.next=AC.currentTime+0.15;
    if(AC.state==='suspended')AC.resume();
  }catch(e){AC=null;}
}
function setMute(m){save.mute=m;writeSave();if(master&&AC)master.gain.setTargetAtTime(m?0:0.9,AC.currentTime,0.05);}
function tone(f,t,dur,type,vol,dest,f2){if(!AC)return;try{const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(dest||sfxG);o.start(t);o.stop(t+dur+0.05);}catch(e){}}
function pad(f,t,dur,vol){if(!AC)return;try{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+dur*0.35);g.gain.linearRampToValueAtTime(0.0001,t+dur*1.15);o.connect(g);g.connect(musG);o.start(t);o.stop(t+dur*1.2);}catch(e){}}
function noise(t,dur,vol,fc){if(!AC)return;try{const s=AC.createBufferSource(),g=AC.createGain(),f=AC.createBiquadFilter();s.buffer=noiseBuf;s.loop=true;f.type='lowpass';f.frequency.value=fc;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);s.connect(f);f.connect(g);g.connect(sfxG);s.start(t);s.stop(t+dur+0.02);}catch(e){}}
function sfx(n){if(!AC)return;const t=AC.currentTime;switch(n){
  case 'jump':tone(330,t,0.16,'sine',0.16,null,520);break;
  case 'land':noise(t,0.09,0.18,300);break;
  case 'scroll':tone(1047,t,0.9,'sine',0.2);tone(1568,t+0.09,0.9,'sine',0.14);tone(2093,t+0.18,1.2,'sine',0.1);break;
  case 'oil':tone(523,t,0.2,'triangle',0.15);tone(784,t+0.08,0.3,'triangle',0.12);break;
  case 'fade':tone(300,t,0.5,'sine',0.09,null,90);noise(t,0.4,0.05,900);break;
  case 'cp':tone(392,t,0.5,'triangle',0.16);tone(587,t+0.14,0.7,'triangle',0.16);break;
  case 'virtue':[523,659,784,1047,1319].forEach((f,i)=>tone(f,t+i*0.12,1.3,'triangle',0.15));break;
  case 'stumble':tone(220,t,0.5,'sine',0.13,null,147);break;
  case 'grace':tone(294,t,0.8,'sine',0.1);tone(440,t+0.2,0.9,'sine',0.1);break;
  case 'love':tone(440,t,0.6,'sine',0.14);tone(554,t+0.15,0.6,'sine',0.14);tone(659,t+0.3,0.9,'sine',0.14);break;
  case 'burden':tone(110,t,0.3,'triangle',0.2,null,80);break;
  case 'rest':[392,494,587,784].forEach((f,i)=>tone(f,t+i*0.1,1.0,'sine',0.13));break;
  case 'ui':tone(660,t,0.08,'sine',0.09);break;
  case 'thunder':noise(t,1.8,0.22,150);break;
  case 'splash':noise(t,0.35,0.2,1200);break;
  case 'grow':tone(196,t,0.9,'triangle',0.1,null,392);break;
}}
const SCALES={maj:[0,2,4,5,7,9,11],dor:[0,2,3,5,7,9,10],lyd:[0,2,4,6,7,9,11],aeo:[0,2,3,5,7,8,10],mix:[0,2,4,5,7,9,10]};
const _=null;
// Original melodies, written as steps of each scale. Not taken from any hymn.
const SONGS={
  title:{root:50,sc:'mix',bpm:66,mel:[4,_,_,2,0,_,_,_,3,_,_,2,4,_,_,_,7,_,_,6,4,_,_,_,2,_,1,_,0,_,_,_],bass:[0,3,6,0]},
  c1:{root:50,sc:'maj',bpm:88,mel:[0,_,2,4,4,_,2,_,5,_,4,2,1,_,_,_,2,_,4,5,7,_,5,_,4,2,1,_,0,_,_,_],bass:[0,3,4,0]},
  c2:{root:52,sc:'dor',bpm:76,mel:[0,_,_,2,3,_,4,_,6,_,4,_,3,2,_,_,4,_,_,3,2,_,0,_,1,_,2,_,0,_,_,_],bass:[0,3,0,-1]},
  c3:{root:55,sc:'lyd',bpm:94,mel:[4,_,2,_,0,_,2,4,7,_,_,5,4,_,_,_,5,_,4,_,2,_,4,5,3,_,1,_,0,_,_,_],bass:[0,1,4,0]},
  c4:{root:45,sc:'aeo',bpm:70,mel:[7,_,_,_,9,_,8,_,7,_,_,6,7,_,_,_,11,_,_,10,9,_,8,_,9,_,_,_,7,_,_,_],bass:[0,5,3,4]},

  c6:{root:50,sc:'aeo',bpm:58,mel:[0,_,_,_,_,_,2,_,1,_,_,_,0,_,_,_,4,_,_,_,5,_,4,_,2,_,_,1,0,_,_,_],bass:[0,0,5,4]},

};
function degToMidi(s,d,oct){const sc=SCALES[s.sc];const o=Math.floor(d/7),i=((d%7)+7)%7;return s.root+12*(o+(oct||0))+sc[i];}
const mtof=m=>440*Math.pow(2,(m-69)/12);
function setMusic(id){if(music.id===id)return;music.id=id;music.step=0;if(AC)music.next=AC.currentTime+0.4;}
function musicTick(){
  if(!AC||!music.id||AC.state!=='running')return;
  const s=SONGS[music.id];const spb=60/s.bpm/2;
  if(music.next<AC.currentTime)music.next=AC.currentTime+0.05;
  let guard=0;
  while(music.next<AC.currentTime+0.3&&guard++<8){
    const st=music.step%s.mel.length,t=music.next,sw=music.swell;
    const m=s.mel[st];
    if(m!==null){const f=mtof(degToMidi(s,m,1));tone(f,t,1.2,'triangle',0.12+sw*0.05,musG);tone(f*2,t,0.5,'sine',0.03,musG);if(s.bell||sw>0.6)tone(f*2,t,1.6,'sine',0.045,musG);}
    if(st%8===0){const bd=s.bass[(st/8)%s.bass.length],dur=spb*8;
      pad(mtof(degToMidi(s,bd,-1)),t,dur,0.11);pad(mtof(degToMidi(s,bd+4,0)),t,dur,0.05+sw*0.03);pad(mtof(degToMidi(s,bd+2,0)),t,dur,0.045+sw*0.03);
      if(sw>0.4)pad(mtof(degToMidi(s,bd,1)),t,dur,0.04*sw);}
    if(st%8===4)tone(mtof(degToMidi(s,s.bass[((st-4)/8)%s.bass.length],0)),t,0.9,'triangle',0.05,musG);
    music.step++;music.next+=spb;
  }
}

// ---------------- Input ----------------
const keys={},touches={};let anyTouch=false,mouseShine=false;
const inp={l:false,r:false,jump:false,shine:false,act:false,jumpP:false,actP:false};
let prevJump=false,prevAct=false;
function touchLayout(){
  const s=clamp(Math.min(CW,CH)*0.17,54,80),by=CH-safe.b-22-s*0.55;
  const lx=safe.l+26+s*0.5,rx=lx+s*1.3;
  const jx=CW-safe.r-24-s*0.6;
  return {s:s,left:{x:lx,y:by,r:s*0.5},right:{x:rx,y:by,r:s*0.5},mid:(lx+rx)/2,
    jump:{x:jx,y:by,r:s*0.58},lamp:{x:jx-s*1.3,y:by+s*0.08,r:s*0.5},act:{x:jx-s*0.5,y:by-s*1.2,r:s*0.46},
    pause:{x:CW-safe.r-30,y:safe.t+28,r:20}};
}
function pollInput(){
  let l=!!(keys.ArrowLeft||keys.KeyA),r=!!(keys.ArrowRight||keys.KeyD),j=!!(keys.ArrowUp||keys.KeyW||keys.Space),s=!!(keys.KeyX||keys.KeyJ||keys.KeyL||keys.ShiftLeft||keys.ShiftRight||mouseShine),a=!!(keys.KeyC||keys.KeyK);
  const L=touchLayout();
  for(const id in touches){const t=touches[id];
    if(t.x<CW*0.45&&t.y>CH*0.4){if(t.x<L.mid)l=true;else r=true;}
    else if(t.x>CW*0.5&&t.y>CH*0.3){let best=null,bd=1e9;for(const k of ['jump','lamp','act']){const b=L[k],d=Math.hypot(t.x-b.x,t.y-b.y);if(d<bd){bd=d;best=k;}}
      if(bd<L.s*1.6){if(best==='jump')j=true;else if(best==='lamp')s=true;else a=true;}}
  }
  try{const gps=navigator.getGamepads?navigator.getGamepads():[];for(const gp of gps){if(!gp)continue;const ax=gp.axes[0]||0,B=i=>gp.buttons[i]&&gp.buttons[i].pressed;
    if(ax<-0.35||B(14))l=true;if(ax>0.35||B(15))r=true;if(B(0))j=true;if(B(2)||B(7))s=true;if(B(1)||B(3))a=true;}}catch(e){}
  inp.l=l;inp.r=r;inp.jump=j;inp.shine=s;inp.act=a;
  inp.jumpP=j&&!prevJump;inp.actP=a&&!prevAct;prevJump=j;prevAct=a;
}

const BP=Builder.prototype;

BP.g=function(w,h,mat){for(let c=this.x;c<this.x+w;c++)for(let k=1;k<=h;k++)this.set(c,k,mat||this.mat);this.sx=this.x;this.x+=w;this.h=h;if(this.startH===null)this.startH=h;return this;};
BP.pit=function(w){this.sx=this.x;this.x+=w;return this;};
BP.fb=function(w){for(let c=this.x;c<this.x+w;c++)this.set(c,this.h,'F');this.sx=this.x;this.x+=w;return this;};
BP.cr=function(w){for(let c=this.x;c<this.x+w;c++)this.set(c,this.h,'C');this.sx=this.x;this.x+=w;return this;};
BP.p=function(dx,h,w,ch){for(let i=0;i<w;i++)this.set(this.sx+dx+i,h,ch||'-');return this;};
BP.fp=function(dx,h,w){return this.p(dx,h,w,'F');};
BP.fill=function(c0,c1,h0,h1,ch){for(let c=c0;c<=c1;c++)for(let k=h0;k<=h1;k++)this.set(c,k,ch||'#');if(c1+1>this.x)this.x=c1+1;return this;};

BP.sw=function(dx,hh,w){hh=hh||5;w=w||1;for(let i=0;i<w;i++)for(let k=0;k<hh;k++)this.set(this.sx+dx+i,this.h+1+k,'S');return this;};

let state='title',G=null,runMode='pilgrim';
function gladCount(){return Object.keys(save.glad).length;}
function hiddenCount(){let n=0;for(const k in save.scrolls){const q=k.split('-');if(q[2]==='2'&&+q[1]<2)n++;}return n;}
function lampRadius(){return 135+gladCount()*5+hiddenCount()*6;}
function oilMax(){return 100+gladCount()*3+hiddenCount()*10;}
function buildLevel(fn,rows){const b=new Builder(rows||20);fn(b);return b.finish();}
function prepLevel(lv,ci,si,ng,isRoom){
  const names=CHAP[ci].shadows;let n=0;const extra=[];
  for(const e of lv.ents){
    if(e.type==='sh'){e.name=names[n++%names.length];e.a=1;e.y-=16;e.bx=e.x;e.by=e.y;e.t=rnd(6);e.dir=1;e.sp=ng?1.4:1;e.gone=false;e.r=e.k==='s'?15:11;
      if(ng&&e.k==='w')extra.push({type:'sh',k:'d',x:e.x,y:e.y-66,bx:e.x,by:e.y-66,x0:e.x0,x1:e.x1,name:names[n++%names.length],a:1,t:rnd(6),dir:-1,sp:1.3,gone:false,r:11});}
    else if(e.type==='scroll'){if(save.scrolls[ci+'-'+si+'-'+e.i])e.got=true;}
    else if(e.type==='glad'){if(save.glad[ci+'-'+si])e.gone=true;}
  }
  for(const x of extra)lv.ents.push(x);
  if(isRoom)lv.ents.push({type:'exit',x:1.5*T,y:lv.startY});
}
function newPlayer(lv){return {x:lv.startX,y:lv.startY,vx:0,vy:0,h:28,face:1,ground:false,coy:0,buf:0,anim:0,shine:false,oil:70,carry:null,burdens:[],riding:null,glide:false,sq:0,sinkOff:0};}
function startStage(ci,si){
  ci=clamp(ci|0,0,5);si=clamp(si|0,0,2);
  const st=CHAP[ci].stages[si],ng=runMode==='return';
  const lv=buildLevel(st.build,st.rows);prepLevel(lv,ci,si,ng,false);
  for(let v=0;v<4;v++)if(ng||v+1<ci||(v+1===ci&&si>0))save.virtues[v]=true;
  G={ci:ci,si:si,lv:lv,main:lv,room:false,ret:null,ch:CHAP[ci],st:st,ng:ng,t:0,time:0,stumbles:0,lostFound:false,
    p:newPlayer(lv),cam:{x:0,y:0,shake:0},cp:{x:lv.startX,y:lv.startY},parts:[],toast:null,verse:null,note:null,ending:null,carried:0,
    faith:100,sink:0,intro:3.4,flash:0,calm:0,followers:[],vcard:null,graceI:(Math.random()*GRACE.length)|0,wayI:(ci*3+si)%WAYSIDE.length,
    lr:62,near:null,signText:null,gspawn:0,father:null,trail:[],thunder:rnd(4,9),done:null,dawn:0};
  if(lv.startCarry)G.p.carry=lv.startCarry;
  if(lv.startBurdens)G.p.burdens=lv.startBurdens.slice();

  save.started=true;writeSave();
  if(ci===0&&si===0)journal('start');

  state='play';setMusic(CHAP[ci].song);music.swell=si===2?0.5:0;bgCache=null;updateCam(0,true);
}
function enterRoom(){
  const key=G.ci+'-'+G.si;if(!ROOMS[key])return;
  const lv=buildLevel(ROOMS[key],20);prepLevel(lv,G.ci,G.si,G.ng,true);
  const p=G.p;G.ret={x:p.x,y:p.y,cp:G.cp,burdens:p.burdens.slice(),carry:p.carry};
  G.lv=lv;G.room=true;p.x=lv.startX+T;p.y=lv.startY;p.vx=p.vy=0;p.riding=null;G.cp={x:p.x,y:p.y};
  journal('room');toast(save.scrolls[G.ci+'-'+G.si+'-2']?'A harder way. You found this hidden scroll before.':'A harder way. Reach the hidden scroll at the far end, and your lamp grows stronger for the rest of the journey.');sfx('cp');updateCam(0,true);
}
function leaveRoom(){
  const p=G.p;if(G.hiddenNew&&!G.hiddenTold){G.hiddenTold=true;G.reward=null;toast('Back on the road, with a stronger lamp.');}G.lv=G.main;G.room=false;p.x=G.ret.x;p.y=G.ret.y;p.vx=p.vy=0;G.cp=G.ret.cp;p.burdens=G.ret.burdens;p.carry=G.ret.carry;sfx('cp');updateCam(0,true);
}
function toast(text){G.toast={text:text,t:0};}
function showVerse(k,kind){G.verse={k:k,t:0,kind:kind||'scroll',label:refLabel(k)};}
function part(x,y,vx,vy,life,col,size,grav,glw){if(G.parts.length>240)G.parts.shift();G.parts.push({x:x,y:y,vx:vx,vy:vy,life:life,max:life,col:col,size:size||2,g:grav||0,glow:glw||0});}
function burst(x,y,n,col,sp,glw){for(let i=0;i<n;i++){const a=rnd(TAU),s=rnd(sp*0.3,sp);part(x,y,Math.cos(a)*s,Math.sin(a)*s,rnd(0.4,1.1),col,rnd(1.5,3),0,glw);}}

function tileCh(c,r){const lv=G.lv;if(r<0||r>=lv.H)return ' ';if(c<0||c>=lv.W)return '#';return lv.tiles[r][c];}
function solid(c,r){const ch=tileCh(c,r);
  switch(ch){case '#':case '=':case '~':case 'C':return true;
    case 'S':return G.lv.sH[r*G.lv.W+c]>0;
    case 'V':return !(G.lv.vigil&&G.lv.vigil.done);
    default:return false;}}
function oneWay(c,r){const ch=tileCh(c,r);if(ch==='-')return true;if(ch==='F')return save.virtues[0];if(ch==='B')return G.lv.grow&&G.lv.grow.on&&r*T>=G.lv.grow.y;return false;}
function blockers(){const out=[];for(const e of G.lv.ents){if((e.type==='wand'&&!e.friend)||(e.type==='gate'&&!e.open))out.push(e);}return out;}
function moveX(p,dx){
  if(!dx)return;const ox=p.x;p.x+=dx;
  const t=Math.floor((p.y-p.h)/T),b=Math.floor((p.y-0.01)/T);
  if(dx>0){const c=Math.floor((p.x+7)/T);for(let r=t;r<=b;r++)if(solid(c,r)){p.x=c*T-7.01;p.vx=0;break;}}
  else{const c=Math.floor((p.x-7)/T);for(let r=t;r<=b;r++)if(solid(c,r)){p.x=(c+1)*T+7.01;p.vx=0;break;}}
  for(const e of blockers()){if(Math.abs(p.y-e.y)<80&&Math.abs(p.x-e.x)<17){p.x=ox<e.x?e.x-17:e.x+17;p.vx=0;}}
}
function moveY(p,dy){
  const prevB=p.y;p.y+=dy;p.ground=false;let landed=null;
  const l=Math.floor((p.x-6)/T),r=Math.floor((p.x+6)/T);
  if(dy>=0){
    const rr=Math.floor(p.y/T);
    for(let c=l;c<=r;c++){if(solid(c,rr)||(oneWay(c,rr)&&prevB<=rr*T+0.01)){p.y=rr*T;p.ground=true;break;}}
    if(!p.ground){for(const e of G.lv.ents){if(e.type!=='boat')continue;if(Math.abs(p.x-e.x)<e.w/2+5&&prevB<=e.y-e.dy+5&&p.y>=e.y){p.y=e.y;p.ground=true;landed=e;break;}}}
    if(p.ground){if(p.vy>260){sfx('land');p.sq=1;for(let i=0;i<4;i++)part(p.x+rnd(-6,6),p.y,rnd(-40,40),rnd(-30,-5),0.4,'rgba(230,220,200,0.6)',2);}p.vy=0;}
  }else{
    const rr=Math.floor((p.y-p.h)/T);
    for(let c=l;c<=r;c++)if(solid(c,rr)){p.y=(rr+1)*T+p.h;p.vy=0;break;}
  }
  p.riding=landed;
}
function darkAt(){
  const lv=G.lv,col=G.p.x/T,k=lv.dk;let d=k[0][1];
  for(let i=0;i<k.length;i++){if(col>=k[i][0]){d=k[i][1];if(i+1<k.length){const n=k[i+1];if(n[0]-k[i][0]<=12)d=lerp(k[i][1],n[1],clamp((col-k[i][0])/Math.max(1,n[0]-k[i][0]),0,1));}}}
  if(G.ng)d+=0.06;
  if(lv.skyClimb)d*=clamp(G.p.y/(lv.H*T),0,1);
  d*=1-0.65*G.calm;d*=1-0.4*G.dawn;
  return clamp(d,0,0.95);
}
function stumble(){
  if(G.carried>0||G.ending||G.sink>0)return;const p=G.p;
  G.stumbles++;G.carried=1.5;G.fromX=p.x;G.fromY=p.y-14;sfx('stumble');G.cam.shake=5;
  showVerse(GRACE[G.graceI++%GRACE.length],'grace');journal('stumble');
  burst(p.x,p.y-14,10,'#ffe9a8',70,1);
}
function respawn(){
  const p=G.p,lv=G.lv;p.x=G.cp.x;p.y=G.cp.y;p.vx=p.vy=0;p.riding=null;p.sinkOff=0;G.faith=100;sfx('grace');
  for(let r=0;r<lv.H;r++)for(let c=0;c<lv.W;c++)if(lv.tiles[r][c]==='c'){lv.tiles[r][c]='C';lv.cr[r*lv.W+c]=0;}
  if(lv.storm)lv.storm.x=G.cp.x-430;
  if(lv.flood&&lv.flood.on)lv.flood.y=Math.max(lv.flood.y,G.cp.y+230);
  if(lv.giant)lv.giant.x=G.cp.x-400;
  if(lv.vigil){lv.vigil.off=0;lv.vigil.t=Math.max(0,lv.vigil.t-6);}
  for(const e of lv.ents){if(e.type==='sh'){if(e.k==='g'||e.k==='m')e.gone=true;else if(e.k==='c'||e.k==='s'){e.x=e.bx;e.y=e.by;}}}
  burst(p.x,p.y-14,14,'#fff3c0',80,1);updateCam(0,true);
}
function growTree(e){
  const lv=G.lv,H=e.H,c=e.c,put=(cc,hh)=>{const r=lv.H-hh;if(r>=0&&r<lv.H&&cc>=0&&cc<lv.W&&lv.tiles[r][cc]===' ')lv.tiles[r][cc]='-';};
  let i=0;for(let k=3;k<H;k+=3,i++){if(e.grow*H>=k){if(i%2===0){put(c-2,e.gh+k);put(c-1,e.gh+k);}else{put(c+1,e.gh+k);put(c+2,e.gh+k);}}}
  if(e.grow>=1)for(let d=-2;d<=2;d++)put(c+d,e.gh+H);
}
function actNeed(e){
  switch(e.type){
    case 'lost':return {dur:1.1,label:'Offer your hand'};
    case 'wand':return {dur:1.6,label:'Offer your hand',block:save.virtues[2]?null:'You do not yet know how to love an enemy.'};
    case 'gate':return {dur:1.2,label:'Forgive',block:save.virtues[3]?null:'You do not yet know how to forgive.'};
    case 'cross':return {dur:1.0,label:'Lay it down',block:save.virtues[3]?null:'You do not yet know how to let go. Look for the shrine.'};
    case 'soil':return {dur:0.7,label:'Plant a seed'};
    case 'carry':return {dur:0.7,label:e.who==='lamb'?'Lift the lamb':'Lift him up'};
    case 'door':return {dur:0.5,label:'Enter'};
    case 'exit':return {dur:0.5,label:'Leave'};
  }return null;
}
function canAct(e){const p=G.p;
  switch(e.type){case 'lost':return !e.found;case 'wand':return !e.friend;case 'gate':return !e.open;case 'cross':return p.burdens.length>0;
    case 'soil':return !e.planted;case 'carry':return !e.taken;case 'door':case 'exit':return true;}return false;}
function doAct(e){
  const p=G.p,lv=G.lv,key=G.ci+'-'+G.si;
  switch(e.type){
    case 'lost':e.found=true;G.lostFound=true;if(!G.room){save.lost[key]=1;writeSave();}G.followers.push({x:e.x,y:e.y,seed:G.followers.length});sfx('love');toast('“I thought I was forgotten. May I walk with you?”');journal('lost');burst(e.x,e.y-16,14,'#ffd9e0',60,1);break;
    case 'wand':e.friend=true;sfx('love');toast('“'+e.thanks+'”');burst(e.x,e.y-18,16,'#ffd9e0',70,1);break;
    case 'gate':e.open=true;sfx('rest');toast('You forgive '+e.name+'. The gate swings open.');burst(e.x,e.y-30,18,'#fff3c0',90,1);break;
    case 'cross':for(let i=0;i<p.burdens.length;i++)part(p.x-8,p.y-18,rnd(-60,-10),rnd(-120,-40),1.2,'#6b6570',5,500);p.burdens=[];sfx('rest');showVerse(G.t%2<1?'Matthew 11:28':'Matthew 11:30','grace');burst(e.x,e.y-30,20,'#fff3c0',90,1);break;
    case 'soil':e.planted=true;e.grow=0;sfx('grow');if(e.great){lv.grow.on=true;lv.grow.y=e.y;toast('It is growing. Climb!');music.swell=1;}break;
    case 'carry':e.taken=true;p.carry=e.who;sfx('love');if(lv.flood&&!lv.flood.on){lv.flood.on=true;lv.flood.y=lv.H*T+50;toast('The water is rising. Climb!');music.swell=1;}break;
    case 'door':enterRoom();break;
    case 'exit':leaveRoom();break;
  }
}
function spawnMotes(e){for(let i=0;i<3;i++){const a=-Math.PI/2+(i-1)*1.1+rnd(-0.2,0.2);G.lv.ents.push({type:'sh',k:'m',x:e.x,y:e.y,bx:e.x,by:e.y,vx:Math.cos(a)*90,vy:Math.sin(a)*70,name:e.name,a:0.9,t:0,dir:1,sp:e.sp,gone:false,r:7});}}
function updShadow(e,dt){
  if(e.gone)return;const p=G.p;e.t+=dt;
  const lx=p.x+p.face*10,ly=p.y-20,dx=e.x-lx,dy=e.y-ly,d=Math.hypot(dx,dy)||1,lit=p.shine&&d<G.lr;
  if(d<300)G.shadowSeen=G.t;
  switch(e.k){
    case 'w':e.x+=e.dir*34*e.sp*dt;if(e.x>e.x1)e.dir=-1;if(e.x<e.x0)e.dir=1;e.y=e.by+Math.sin(e.t*3)*3;break;
    case 'f':e.y=e.by+Math.sin(e.t*1.4*e.sp)*e.amp;break;
    case 'd':e.x+=e.dir*46*e.sp*dt;if(e.x>e.x1)e.dir=-1;if(e.x<e.x0)e.dir=1;e.y=e.by+Math.sin(e.t*2)*18;break;
    case 'c':if(!p.shine&&d<330){e.x-=dx/d*64*e.sp*dt;e.y-=dy/d*40*e.sp*dt;}break;
    case 's':if(d<230&&!lit){e.x-=dx/d*20*dt;e.y-=dy/d*12*dt;}e.y+=Math.sin(e.t*2.2)*0.3;break;
    case 'm':e.x+=e.vx*dt;e.y+=e.vy*dt;e.vx*=1-1.5*dt;e.vy*=1-1.5*dt;if(!lit){e.x-=dx/d*30*dt;e.y-=dy/d*30*dt;}e.a-=dt*0.12;break;
    case 'g':if(!lit){e.x-=dx/d*52*e.sp*dt;e.y-=dy/d*30*e.sp*dt;}break;
  }
  if(lit){

    font(12,'italic');ctx.fillStyle='#f6ecd0';ctx.fillText(V('Psalm 119:105'),VW/2,66);font(10);ctx.fillStyle='#e0c070';ctx.fillText('Psalm 119:105 (ESV)',VW/2,80);
    let sc=0,lo=0;for(const k in save.scrolls)sc++;for(const k in save.lost)lo++;
    font(12);ctx.fillStyle='#e9d9a8';ctx.fillText('Scrolls found: '+sc+' of 54     Lost Ones who walked home with you: '+lo+' of 18',VW/2,104);ctx.fillText('Oil of Gladness gathered: '+gladCount()+' of 18',VW/2,121);
    font(12,'italic');ctx.fillStyle='#fff6dc';ctx.fillText('A pilgrimage in six parables, made for friends, with love.',VW/2,146);
    if(G&&!G.ng){font(11);ctx.fillStyle='#bfe0ff';ctx.fillText('Pilgrim’s Return is now open on the title page: the same road, with stronger Shadows.',VW/2,164);}
    font(9.5);ctx.fillStyle='rgba(233,217,168,0.85)';let y=186;y+=textBlock(ESV_NOTICE,VW/2,y,w,12.5)+4;textBlock(ESV_TRADEMARK,VW/2,y,w,12.5);
    btn('Go On',VW/2-70,VH-38,140,28,()=>showCard(5,'reflect',()=>{ui.msg=save.retDone?'Well done, twice over.':'Pilgrim’s Return is now open.';go('title');setMusic('title');}));ui.back=null;}
}
// ---- Input wiring ----
function pauseGame(){if(state==='play'){go('pause');}}
function uiTap(px,py){
  const qx=(px-OX)/SC,qy=(py-OY)/SC;
  if(state==='play'){
    if(G.vcard){G.vcard.skip=true;return true;}
    if(G.ending){G.ending.skip=true;return true;}
    const b=G.pauseBtn;if(b&&Math.hypot(qx-b.x,qy-b.y)<b.r+8){pauseGame();return true;}
    const h=G.helpBtn;if(h&&Math.hypot(qx-h.x,qy-h.y)<h.r+6){openControls('play');return true;}
    return false;}
  if(state==='card'){cardAdvance();return true;}
  if(state==='finale'&&FIN&&FIN.ph<4){finAdvance();return true;}
  for(let i=0;i<ui.btns.length;i++){const b=ui.btns[i];if(!b.dis&&qx>=b.x&&qx<=b.x+b.w&&qy>=b.y&&qy<=b.y+b.h){ui.sel=i;sfx('ui');b.fn();return true;}}
  return true;
}
function keyPress(code){
  if(code==='KeyM'){setMute(!save.mute);return;}
  if(state==='play'){if(code==='Escape'||code==='KeyP')pauseGame();else if(code==='KeyH'||code==='Slash')openControls('play');return;}
  if(code==='KeyH'||code==='Slash'){if(state==='title')openControls('title');else if(state==='pause')openControls('pause');else if(state==='controls'&&ui.back)ui.back();return;}
  const goKey=code==='Enter'||code==='Space'||code==='NumpadEnter';
  if(state==='card'){if(goKey||code==='KeyX'||code==='KeyC'||code==='ArrowRight')cardAdvance();return;}
  if(state==='finale'&&FIN&&FIN.ph<4){if(goKey||code==='ArrowRight')finAdvance();return;}
  const n=ui.btns.length;if(!n)return;
  const step=d=>{for(let k=0;k<n;k++){ui.sel=(ui.sel+d+n)%n;if(!ui.btns[ui.sel].dis)break;}sfx('ui');};
  if(code==='ArrowDown'||code==='ArrowRight'||code==='KeyS'||code==='KeyD')step(1);
  else if(code==='ArrowUp'||code==='ArrowLeft'||code==='KeyW'||code==='KeyA')step(-1);
  else if(goKey){const b=ui.btns[ui.sel];if(b&&!b.dis){sfx('ui');b.fn();}}
  else if(code==='Escape'||code==='KeyP'){if(ui.back)ui.back();}
}
addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].indexOf(e.code)>=0)e.preventDefault();initAudio();if(!keys[e.code]){keys[e.code]=true;keyPress(e.code);}});
addEventListener('keyup',e=>{keys[e.code]=false;});
addEventListener('blur',()=>{mouseShine=false;for(const k in keys)keys[k]=false;for(const k in touches)delete touches[k];if(state==='play')pauseGame();});
cv.addEventListener('touchstart',e=>{e.preventDefault();anyTouch=true;initAudio();for(const t of e.changedTouches){if(!uiTap(t.clientX,t.clientY))touches[t.identifier]={x:t.clientX,y:t.clientY};}},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches){const o=touches[t.identifier];if(o){o.x=t.clientX;o.y=t.clientY;}}},{passive:false});
const tEnd=e=>{e.preventDefault();for(const t of e.changedTouches)delete touches[t.identifier];};
cv.addEventListener('touchend',tEnd,{passive:false});cv.addEventListener('touchcancel',tEnd,{passive:false});
let lastTouchT=0;cv.addEventListener('touchstart',()=>{lastTouchT=Date.now();},{passive:true});
cv.addEventListener('mousedown',e=>{if(Date.now()-lastTouchT<700)return;initAudio();if(!uiTap(e.clientX,e.clientY)&&state==='play')mouseShine=true;});
addEventListener('mouseup',()=>{mouseShine=false;});
cv.addEventListener('mousemove',e=>{if(state==='play'||anyTouch)return;const qx=(e.clientX-OX)/SC,qy=(e.clientY-OY)/SC;for(let i=0;i<ui.btns.length;i++){const b=ui.btns[i];if(!b.dis&&qx>=b.x&&qx<=b.x+b.w&&qy>=b.y&&qy<=b.y+b.h){ui.sel=i;break;}}});
for(const ev of ['gesturestart','gesturechange','dblclick','contextmenu'])document.addEventListener(ev,e=>e.preventDefault(),{passive:false});

// ---- Main loop ----
let lastT=0;
function frame(ts){
  requestAnimationFrame(frame);
  let dt=(ts-lastT)/1000;lastT=ts;if(!(dt>0))dt=0.016;if(dt>0.05)dt=0.05;
  pollInput();musicTick();ui.t+=dt;
  if(state==='play'){const n=dt>0.02?2:1;for(let i=0;i<n&&state==='play';i++){updatePlay(dt/n);inp.jumpP=false;inp.actP=false;}}
  else if(state==='finale')updateFinale(dt);
  else if(state==='card'&&CARD){CARD.t+=dt;CARD.lt+=dt;}
  if(state!=='play'&&state!=='finale')music.swell=Math.max(0,music.swell-dt*0.3);
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.fillStyle='#07060c';ctx.fillRect(0,0,CW,CH);
  ctx.save();ctx.translate(OX,OY);ctx.scale(SC,SC);ctx.beginPath();ctx.rect(0,0,VW,VH);ctx.clip();
  ui.btns=[];
  switch(state){
    case 'title':drawTitle();break;
    case 'map':drawMap();break;
    case 'virtues':drawVirtues();break;
    case 'scrolls':drawScrolls();break;
    case 'journal':drawJournal();break;
    case 'about':drawAbout();break;
    case 'controls':if(ctrlFrom!=='title')drawWorld();drawControls();break;
    case 'card':drawCard();break;
    case 'play':drawWorld();drawHUD();break;
    case 'pause':drawWorld();drawPause();break;
    case 'complete':drawWorld();drawComplete();break;
    case 'finale':drawFinale();break;
  }
  if(ui.sel>=ui.btns.length)ui.sel=0;
  ctx.restore();
  if(state==='play'&&anyTouch&&!G.vcard)drawTouch();
  if(portrait&&state!=='play'){ctx.setTransform(DPR,0,0,DPR,0,0);ctx.font='13px '+FONT;ctx.fillStyle='rgba(233,217,168,0.75)';ctx.textAlign='center';ctx.fillText('Turn your phone sideways for the best view',CW/2,OY+VH*SC+30);}
  const hd=state==='title'?'':'none';if(homeLink.style.display!==hd)homeLink.style.display=hd;
}
loadSave();resize();setMusic('title');
window.__lamp={
  get state(){return {screen:state,mode:runMode,play:G,save:save};},
  startStage:function(ci,si){runMode='pilgrim';startStage(ci,si);},
  startReturn:function(ci,si){runMode='return';startStage(ci,si);},
  unlockAll:function(){save.unlocked=17;save.retUnlocked=17;save.virtues=[true,true,true,true];save.finished=true;save.started=true;writeSave();},
  finale:function(){startFinale();},
  enterRoom:function(){if(G&&!G.room)enterRoom();},
  screen:function(s){go(s);},card:function(ci,kind){showCard(ci,kind,function(){go('title');});},
  verses:VERSES,stages:NUM_STAGES
};
requestAnimationFrame(frame);
})();
</script>
